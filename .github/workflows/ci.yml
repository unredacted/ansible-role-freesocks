name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every YAML parses and the test playbooks pass ansible's own syntax check.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # Pinned: verified against ansible-core 2.21.x (2.19+ lazy templating).
      - name: Install ansible-core
        run: pipx install 'ansible-core~=2.21.2'
      - name: YAML-parse every role file
        run: |
          python3 - <<'EOF'
          import sys, yaml, pathlib
          bad = []
          for p in pathlib.Path('.').rglob('*.yml'):
              if '.git' in p.parts:
                  continue
              try:
                  list(yaml.safe_load_all(p.read_text()))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all YAML files parse")
          EOF
      - name: Syntax-check the test playbooks
        run: |
          export ANSIBLE_ROLES_PATH="$(dirname "$PWD")"
          for f in tests/test_*.yml; do
            echo "== $f"
            ansible-playbook --syntax-check "$f"
          done

  # The offline tests: the bootstrap contract against the mock FCP, the
  # retirement contract, the Caddyfile and compose renders, address resolution.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install ansible-core
        run: pipx install 'ansible-core~=2.21.2'
      - name: Run the offline tests
        run: tests/run.sh
