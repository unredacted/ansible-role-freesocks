# Example playbook for ansible-role-freesocks v2.
# See README.md for the variables.
#
#   ansible-playbook -i hosts example-playbook.yml -e target=node1 \
#     -e operation_mode=deploy -e node_purpose=direct
#
# The role bootstraps the machine and enrolls it with the FreeSocks Control
# Plane (FCP). FCP owns the panel, the origin DNS of a front node, the
# fronting and the release to members: after this play, approve the node in
# Admin -> Servers (and, for a front or relay node, Edges -> Protect a node).
#
# Names, addresses and tokens below are placeholders (RFC 2606 / RFC 5737).

- name: FreeSocks node
  hosts: "{{ target }}"
  remote_user: root
  vars:
    # deploy | update | wipe
    operation_mode: "{{ operation_mode | default('deploy') }}"
    # direct | front | relay
    node_purpose: "{{ node_purpose | default('direct') }}"

    fcp_api_url: "https://fcp.example.org"
    fcp_api_token: "{{ vault_fcp_api_token }}"   # an fsv1_ token, vaulted
    fcp_remnawave_panel_slug: "remnawave-primary"

    # Front nodes: Caddy registers with the ACME provider under this address.
    remnawave_caddy_email: "ops@example.org"

    # Relay nodes on a tailnet: the panel dials the overlay address, an edge
    # dials the public one.
    # node_address_interface: "tailscale0"
    # node_origin_address: "203.0.113.7"
  roles:
    - ansible-role-freesocks
