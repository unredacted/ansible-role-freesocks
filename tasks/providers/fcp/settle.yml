---
# tasks/providers/fcp/settle.yml
#
# Tell FCP how a reserved create ended.
#
# Caller passes:
#   _fcp_res_key      the key given to reserve.yml
#   _fcp_res_created  the new object's panel uuid ('' when none came back)
#   _fcp_res_status   the panel's HTTP status for the create
#
# Settled as created when a uuid came back. Settled as refused ONLY on a 400 or
# 409 (the panel's checks, which run before it writes). Anything less certain,
# a 5xx, a 2xx without a uuid, is NOT settled: the reservation stays open and
# FCP closes it by itself once it sees the object on the panel.
#
# A settle that cannot reach FCP does not fail the run: the object exists, and
# FCP adopts it at its next look at the panel.

- name: "Settle in FCP ({{ _fcp_res_key }})"
  uri:
    url: "{{ fcp_api_url }}/api/v1/admin/servers/{{ fcp_remnawave_panel_slug | urlencode }}/reservations/{{ (_fcp_run_id ~ ':' ~ _fcp_res_key) | urlencode }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ fcp_api_token }}"
      Content-Type: "application/json"
      Accept: "application/json"
    body_format: json
    body: >-
      {{ {'created': _fcp_res_created} if (_fcp_res_created | default('') | length > 0)
         else {'rejected_pre_mutation': true} }}
    status_code: [200]
  delegate_to: localhost
  no_log: true
  register: _fcp_settle
  when: >-
    (_fcp_res_created | default('') | length > 0)
    or ((_fcp_res_status | default(0) | int) in [400, 409])
  retries: "{{ fcp_managed_retries | default(3) }}"
  delay: "{{ fcp_managed_delay | default(5) }}"
  until: _fcp_settle.status | default(0) == 200
  failed_when: false

- name: "Note an unsettled reservation ({{ _fcp_res_key }})"
  debug:
    msg: >-
      Could not tell FCP how '{{ _fcp_res_key }}' ended. The reservation stays
      open; FCP closes it when it next sees the object on the panel.
  when: (_fcp_settle.status | default(0)) != 200
