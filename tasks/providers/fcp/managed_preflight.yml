---
# tasks/providers/fcp/managed_preflight.yml
#
# fcp_managed=true: this panel's objects are ALSO written from FCP's admin
# (Servers). Two writers need a protocol, and this file is its first step:
#
#   1. FAIL CLOSED. If FCP cannot be reached the run stops here, before any
#      panel call. With fcp_managed set, the role creates nothing and rewrites
#      no Config Profile without FCP's say. fcp_managed is a durable inventory
#      var on purpose: it must not depend on FCP being up to be known.
#   2. Report the handoff (the contract version this role follows). FCP refuses
#      its own writes to an instance whose role has not reported a current one.
#
# Contract version 1:
#   * an EXISTING Config Profile is never PATCHed by the role;
#   * an absent node, Host, squad or profile is created only after a
#     reservation (reserve.yml), and the outcome is settled (settle.yml);
#   * what FCP removed on purpose (a tombstone) is never recreated.
#
# Scope: the existing fsv1_ token (admin:servers:write). No new scope.

- name: Validate the FCP-managed prerequisites
  assert:
    that:
      - fcp_api_url | default('') | length > 0
      - fcp_api_token | default('') | length > 0
      - fcp_remnawave_panel_slug | default('') | length > 0
    fail_msg: >-
      fcp_managed=true requires fcp_api_url, fcp_api_token and
      fcp_remnawave_panel_slug (the panel's slug in FCP). Refusing to touch the
      panel without them.
  no_log: true

- name: Name this run (the prefix of every reservation it makes)
  set_fact:
    _fcp_run_id: "{{ '%Y%m%dT%H%M%S' | strftime }}-{{ 999999 | random }}"
  when: _fcp_run_id is not defined

- name: Report the role handoff to FCP (fails closed when FCP is unreachable)
  uri:
    url: "{{ fcp_api_url }}/api/v1/admin/servers/{{ fcp_remnawave_panel_slug | urlencode }}/handoff"
    method: PUT
    headers:
      Authorization: "Bearer {{ fcp_api_token }}"
      Content-Type: "application/json"
      Accept: "application/json"
    body_format: json
    body:
      roleContractVersion: "{{ fcp_role_contract_version | int }}"
    status_code: [200]
    return_content: yes
  delegate_to: localhost
  no_log: true
  register: _fcp_handoff
  retries: "{{ fcp_managed_retries | default(3) }}"
  delay: "{{ fcp_managed_delay | default(5) }}"
  until: _fcp_handoff.status | default(0) == 200

- name: Assert FCP accepts this role's contract version
  assert:
    that:
      - _fcp_handoff.json.current | default(false) | bool
    fail_msg: >-
      FCP requires role contract version {{ _fcp_handoff.json.required | default('?') }};
      this role follows {{ fcp_role_contract_version }}. Update the role.
