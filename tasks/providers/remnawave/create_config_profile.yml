---
# tasks/providers/remnawave/create_config_profile.yml
#
# Ensure a Config Profile exists on the panel carrying the WS (+ optional
# Reality) inbounds a FreeSocks node needs, then read back each inbound's UUID by
# tag (+ the profile UUID) so create_squad and node deploys can reference them.
# Idempotent: GET /api/config-profiles, match by name, POST only when absent.
# Panel-only (delegate_to: localhost); part of operation_mode=bootstrap.
#
# VERIFY on your panel /docs before the first run (the contract drifts across
# versions — pin these):
#   * POST body: { name, config: { inbounds, outbounds, ... } }  (raw Xray under `config`)
#   * inbound read-back: GET /api/config-profiles/inbounds -> response[].{uuid,tag}
#   * Reality streamSettings.network: "raw" (v2.8) vs "tcp" (older) — see the
#     remnawave_bootstrap_reality_network default.

- name: List existing Config Profiles
  uri:
    url: "{{ remnawave_panel_url }}/api/config-profiles"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_api_token }}"
      Accept: "application/json"
    status_code: [200]
    return_content: yes
  delegate_to: localhost
  no_log: true
  register: _rw_profiles_list

- name: Normalize the Config Profiles list payload
  set_fact:
    _rw_profiles: "{{ _rw_profiles_list.json.response['configProfiles'] if (_rw_profiles_list.json.response is mapping and 'configProfiles' in _rw_profiles_list.json.response) else _rw_profiles_list.json.response }}"

- name: Determine whether the FreeSocks Config Profile already exists
  set_fact:
    _rw_profile_exists: "{{ remnawave_bootstrap_config_profile_name in (_rw_profiles | map(attribute='name') | list) }}"

- name: Build the Reality inbound (inject the generated x25519 private key)
  set_fact:
    _rw_reality_inbound:
      tag: "VLESS_REALITY"
      listen: "0.0.0.0"
      port: 443
      protocol: "vless"
      settings: { clients: [], decryption: "none" }
      streamSettings:
        network: "{{ remnawave_bootstrap_reality_network }}"
        security: "reality"
        realitySettings:
          dest: "{{ remnawave_bootstrap_reality_dest }}"
          serverNames: "{{ remnawave_bootstrap_reality_server_names }}"
          privateKey: "{{ remnawave_reality_private_key | default('') }}"
          shortIds: "{{ remnawave_bootstrap_reality_short_ids }}"
      sniffing: { enabled: true, destOverride: ["http", "tls", "quic"], routeOnly: true }
  no_log: true
  when: remnawave_bootstrap_reality | default(true) | bool

# The relay inbound: same REALITY mechanics as the direct one, but reached
# through an EXTERNAL L4/TCP proxy, so it needs its own listen port, its own
# decoy set (the direct decoy is chosen for probe-resistance, not for
# reachability from the networks relay targets) and its own keypair.
- name: Build the relay Reality inbound (inject the generated relay x25519 key)
  set_fact:
    _rw_relay_inbound:
      tag: "VLESS_RELAY_REALITY"
      listen: "0.0.0.0"
      port: "{{ remnawave_bootstrap_relay_listen_port | int }}"
      protocol: "vless"
      settings: { clients: [], decryption: "none" }
      streamSettings:
        network: "{{ remnawave_bootstrap_relay_network }}"
        security: "reality"
        realitySettings:
          dest: "{{ remnawave_bootstrap_relay_dest }}"
          serverNames: "{{ remnawave_bootstrap_relay_server_names }}"
          privateKey: "{{ remnawave_relay_private_key | default('') }}"
          shortIds: "{{ remnawave_bootstrap_relay_short_ids }}"
      sniffing: { enabled: true, destOverride: ["http", "tls", "quic"], routeOnly: true }
  no_log: true
  when: remnawave_bootstrap_relay | default(true) | bool

# Many L4 forwarders prepend a PROXY-protocol v1/v2 header. Xray has to be told,
# or REALITY reads the header bytes as a malformed ClientHello and EVERY
# connection fails with no useful error. The settings key is derived from the
# carrier name ("raw" on v2.8, "tcp" on older panels). Self-referencing set_fact
# is materialized, so it is safe under 2.19 lazy templating — a task-level
# `vars:` chain here would not be.
- name: Enable PROXY-protocol acceptance on the relay inbound (opt-in)
  set_fact:
    _rw_relay_inbound: >-
      {{ _rw_relay_inbound | combine({'streamSettings':
           _rw_relay_inbound.streamSettings
           | combine({ (remnawave_bootstrap_relay_network ~ 'Settings'): {'acceptProxyProtocol': true} }) }) }}
  no_log: true
  when:
    - remnawave_bootstrap_relay | default(true) | bool
    - remnawave_bootstrap_relay_accept_proxy_protocol | default(false) | bool

# The decoy (dest/serverNames) is deliberately NOT shipped in the role's
# defaults — it is operator-specific and stays in private inventory. An empty
# value would otherwise be POSTed as a permanently dead inbound.
- name: Assert the direct-Reality inbound has a decoy and a key
  assert:
    that:
      - (remnawave_bootstrap_reality_dest | default('')) | length > 0
      - (remnawave_bootstrap_reality_server_names | default([])) | length > 0
      - (remnawave_reality_private_key | default('')) | length > 0
    fail_msg: >-
      The direct-Reality inbound needs remnawave_bootstrap_reality_dest and
      remnawave_bootstrap_reality_server_names (set them in your PRIVATE
      inventory — the role ships no default), plus a generated x25519 key. dest
      must be a real TLS 1.3 host the node can reach and must serve EVERY name
      in serverNames, or a probe sending an unserved SNI gets a cert mismatch.
      A missing key means gen_x25519.yml did not run before this file.
  no_log: true
  when: remnawave_bootstrap_reality | default(true) | bool

- name: Assert the relay inbound has a decoy and a key
  assert:
    that:
      - (remnawave_bootstrap_relay_dest | default('')) | length > 0
      - (remnawave_bootstrap_relay_server_names | default([])) | length > 0
      - (remnawave_relay_private_key | default('')) | length > 0
    fail_msg: >-
      The relay inbound needs remnawave_bootstrap_relay_dest and
      remnawave_bootstrap_relay_server_names (set them in your PRIVATE
      inventory — the role ships no default), plus a generated x25519 key. dest
      must serve EVERY name in serverNames. A missing key means gen_x25519.yml
      did not run with _x25519_target=relay before this file — check the
      bootstrap include order in tasks/main.yml.
  no_log: true
  when: remnawave_bootstrap_relay | default(true) | bool

- name: Assemble the desired inbound set (WS [+ Reality] [+ relay])
  set_fact:
    _rw_bootstrap_inbounds: >-
      {{ remnawave_bootstrap_cdn_inbounds
         + ([_rw_reality_inbound] if (remnawave_bootstrap_reality | default(true) | bool) else [])
         + ([_rw_relay_inbound] if (remnawave_bootstrap_relay | default(true) | bool) else []) }}
  no_log: true

- name: Create the Config Profile (only when absent)
  uri:
    url: "{{ remnawave_panel_url }}/api/config-profiles"
    method: POST
    headers:
      Authorization: "Bearer {{ remnawave_panel_api_token }}"
      Content-Type: "application/json"
      Accept: "application/json"
    body_format: json
    body:
      name: "{{ remnawave_bootstrap_config_profile_name }}"
      config:
        # Born compliant with the FreeSocks no-client-IP posture (FCP
        # docs/privacy.md §5 / PRIVACY_XRAY_LOG — the same block FCP's
        # Admin → Remnawave harden-logging enforces): no access/error/DNS
        # logging, full IP masking if a level is ever raised, and the per-user
        # online-IP tracker OFF. statsUserOnline:false costs the panel's
        # usersOnline signal (FCP's node placement then ties on it and falls
        # back to the realtime-bandwidth tiebreak) — that trade is deliberate.
        log:
          access: "none"
          error: "none"
          loglevel: "none"
          dnsLog: false
          maskAddress: "full"
        policy:
          levels:
            "0": { statsUserOnline: false }
        inbounds: "{{ _rw_bootstrap_inbounds }}"
        outbounds:
          - { protocol: "freedom", tag: "DIRECT" }
          - { protocol: "blackhole", tag: "BLOCK" }
    status_code: [200, 201, 409]
    return_content: yes
  delegate_to: localhost
  no_log: true
  register: _rw_profile_create
  when: not _rw_profile_exists

# Re-list so we resolve the UUID uniformly whether we just created it or it
# pre-existed (create responses vary; the list is the stable source of truth).
- name: Re-list Config Profiles
  uri:
    url: "{{ remnawave_panel_url }}/api/config-profiles"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_api_token }}"
      Accept: "application/json"
    status_code: [200]
    return_content: yes
  delegate_to: localhost
  no_log: true
  register: _rw_profiles_list2

- name: Normalize the re-listed Config Profiles payload
  set_fact:
    _rw_profiles2: "{{ _rw_profiles_list2.json.response['configProfiles'] if (_rw_profiles_list2.json.response is mapping and 'configProfiles' in _rw_profiles_list2.json.response) else _rw_profiles_list2.json.response }}"

- name: Resolve the Config Profile UUID by name
  set_fact:
    remnawave_panel_config_profile_uuid: "{{ (_rw_profiles2 | selectattr('name', 'equalto', remnawave_bootstrap_config_profile_name) | map(attribute='uuid') | list | first) | default('', true) }}"

- name: Assert the Config Profile UUID resolved
  assert:
    that:
      - remnawave_panel_config_profile_uuid | length > 0
    fail_msg: >-
      Could not resolve the '{{ remnawave_bootstrap_config_profile_name }}' Config
      Profile UUID from /api/config-profiles. Profiles on the panel:
      {{ _rw_profiles2 | map(attribute='name') | list | join(', ') | default('(none)', true) }}.
      A panel bootstrapped under an OLDER role default (FreeSocks-CDN) needs
      remnawave_bootstrap_config_profile_name pinned to that existing name —
      otherwise this run tries to create a duplicate (the panel may 409 the
      POST, which is tolerated for idempotency, landing here instead). If the
      names DO match, check the endpoint + response shape against the panel /docs.

# --- Reconcile missing base inbounds into an EXISTING profile ---------------
# The create POST above is gated on `not _rw_profile_exists`, so a panel that was
# bootstrapped under an older role version NEVER gains newly-added base inbounds
# — the relay inbound is exactly that case, and without this block relay works
# only on a virgin panel (i.e. only in CI).
#
# Reconcile by TAG: fetch the live profile, append only the desired inbounds
# whose tag is absent, and full-replace PATCH (same contract as
# create_node_placement.yml). Existing inbounds are NEVER rewritten — so a re-run
# cannot rotate a live inbound's REALITY keys out from under connected clients —
# with ONE additive exception: `sniffing.routeOnly: true` is merged into every
# live inbound (base AND per-node clones) that has sniffing enabled, because a
# profile bootstrapped before the routeOnly fix keeps rewriting destinations to
# the sniffed SNI and Tor stays broken there (the very population the fix
# targets). The merge preserves every other key on the inbound untouched.
# The corollary still holds: changing dest/serverNames on an EXISTING tag is NOT
# reconciled — edit it in the panel, or delete the inbound and re-run.
- name: Resolve the live Config Profile (for missing-inbound reconciliation)
  set_fact:
    _rw_live_profile: >-
      {{ (_rw_profiles2 | selectattr('uuid', 'equalto', remnawave_panel_config_profile_uuid)
          | list | first) | default({}, true) }}
  no_log: true

- name: Compute the desired base inbounds missing from the live profile
  set_fact:
    _rw_missing_inbounds: >-
      {{ _rw_bootstrap_inbounds
         | rejectattr('tag', 'in', (_rw_live_profile.config.inbounds | default([]) | map(attribute='tag') | list))
         | list }}
  no_log: true

# Merge `sniffing.routeOnly: true` into every live inbound that sniffs. Purely
# additive per inbound: only the sniffing mapping gains a key; clients, stream
# settings, and REALITY keys pass through byte-identical.
- name: Merge sniffing routeOnly into the live profile inbounds
  set_fact:
    _rw_live_inbounds_reconciled: >-
      {%- set out = [] -%}
      {%- for ib in (_rw_live_profile.config.inbounds | default([])) -%}
        {%- if (ib.sniffing | default({})).enabled | default(false) -%}
          {%- set _ = out.append(ib | combine({'sniffing': (ib.sniffing | combine({'routeOnly': true}))})) -%}
        {%- else -%}
          {%- set _ = out.append(ib) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true
  when: _rw_profile_exists

- name: Determine whether the sniffing merge changes anything
  set_fact:
    _rw_sniffing_changed: >-
      {{ _rw_profile_exists
         and (_rw_live_inbounds_reconciled | default([])) != (_rw_live_profile.config.inbounds | default([])) }}

- name: Note what is being reconciled into the existing Config Profile
  debug:
    msg: >-
      Reconciling into the existing Config Profile:
      {{ _rw_missing_inbounds | length }} missing base inbound(s)
      ({{ _rw_missing_inbounds | map(attribute='tag') | list | join(', ') | default('none', true) }});
      sniffing routeOnly merge {{ 'CHANGES live inbounds' if (_rw_sniffing_changed | default(false)) else 'already in place' }}.
  when:
    - _rw_profile_exists
    - remnawave_bootstrap_reconcile_inbounds | default(true) | bool
    - (_rw_missing_inbounds | length > 0) or (_rw_sniffing_changed | default(false))

- name: Reconcile the existing Config Profile (sniffing routeOnly + missing base inbounds)
  uri:
    url: "{{ remnawave_panel_url }}/api/config-profiles"
    method: PATCH
    headers:
      Authorization: "Bearer {{ remnawave_panel_api_token }}"
      Content-Type: "application/json"
      Accept: "application/json"
    body_format: json
    body:
      uuid: "{{ remnawave_panel_config_profile_uuid }}"
      config: "{{ _rw_live_profile.config | combine({'inbounds': (_rw_live_inbounds_reconciled | default(_rw_live_profile.config.inbounds | default([]))) + _rw_missing_inbounds}) }}"
    status_code: [200]
  delegate_to: localhost
  no_log: true
  when:
    - _rw_profile_exists
    - remnawave_bootstrap_reconcile_inbounds | default(true) | bool
    - _rw_live_profile.config is defined
    # Deliberately NOT gated on the live inbound list being non-empty: a profile
    # pre-created by hand (or emptied) has config but no inbounds, which is exactly
    # the case that needs populating. `| default([])` in the combine below already
    # handles a missing key, and gating on it made bootstrap fail the read-back
    # assertions instead of filling the profile in.
    - (_rw_missing_inbounds | length > 0) or (_rw_sniffing_changed | default(false))

- name: List Config Profile inbounds (read back the created UUIDs)
  uri:
    url: "{{ remnawave_panel_url }}/api/config-profiles/inbounds"
    method: GET
    headers:
      Authorization: "Bearer {{ remnawave_panel_api_token }}"
      Accept: "application/json"
    status_code: [200]
    return_content: yes
  delegate_to: localhost
  no_log: true
  register: _rw_inbounds_list

- name: Normalize the inbounds list payload
  set_fact:
    _rw_inbounds: "{{ _rw_inbounds_list.json.response['inbounds'] if (_rw_inbounds_list.json.response is mapping and 'inbounds' in _rw_inbounds_list.json.response) else _rw_inbounds_list.json.response }}"

# Map tag -> uuid. Our tags (VLESS_WS_CDN / VLESS_REALITY / VLESS_RELAY_REALITY)
# are FreeSocks-specific, so matching by tag across all returned inbounds is
# safe; when the panel scopes inbounds by profile we still only read our tags.
#
# The match is PANEL-WIDE, so a tag must be globally unique — and it must stay
# OUT of the legacy per-node clone namespaces. create_node_placement.yml builds
# clone tags as `<base_tag>_<HOSTNAME>`, i.e. VLESS_REALITY_<HOSTNAME> and
# VLESS_WS_CDN_<HOSTNAME>. That is why the relay tag is VLESS_RELAY_REALITY and
# NOT VLESS_REALITY_RELAY: the latter is exactly what a DIRECT-Reality node named
# 'relay' mints under per-node placement — and such a node has relay DISABLED, so
# the relay/per-node exclusion assert in tasks/main.yml never fires for it. The
# collision would make create_node_placement treat this base relay inbound as
# that node's existing clone and repoint its Reality Host and squad onto it.
# Do not "tidy" the word order back.
- name: Map inbound tag -> uuid
  set_fact:
    remnawave_bootstrap_inbound_uuids: "{{ remnawave_bootstrap_inbound_uuids | default({}) | combine({ item.tag: item.uuid }) }}"
  loop: "{{ _rw_inbounds }}"
  loop_control:
    label: "{{ item.tag | default('?') }}"
  when:
    - item.tag is defined
    - item.uuid is defined
  no_log: true

- name: Capture the Reality inbound UUID (for node deploys + the Reality squad)
  set_fact:
    remnawave_reality_inbound_uuid: "{{ remnawave_bootstrap_inbound_uuids['VLESS_REALITY'] | default('') }}"
  when: remnawave_bootstrap_reality | default(true) | bool

- name: Capture the relay inbound UUID (for node deploys + the relay squad)
  set_fact:
    remnawave_relay_inbound_uuid: "{{ remnawave_bootstrap_inbound_uuids['VLESS_RELAY_REALITY'] | default('') }}"
  when: remnawave_bootstrap_relay | default(true) | bool

- name: Assert the relay inbound UUID was read back
  assert:
    that:
      - (remnawave_bootstrap_inbound_uuids['VLESS_RELAY_REALITY'] | default('')) | length > 0
    fail_msg: >-
      No VLESS_RELAY_REALITY inbound UUID came back from
      /api/config-profiles/inbounds. On a panel that ALREADY had
      '{{ remnawave_bootstrap_config_profile_name }}' the create POST is skipped
      by design and the relay inbound is added by the reconcile PATCH above —
      which is disabled when remnawave_bootstrap_reconcile_inbounds=false (then
      add the inbound in the panel UI by hand). Otherwise verify the tag the
      panel returns matches VLESS_RELAY_REALITY.
  when: remnawave_bootstrap_relay | default(true) | bool

- name: Assert the CDN inbound UUIDs were read back
  assert:
    that:
      - (remnawave_bootstrap_inbound_uuids['VLESS_WS_CDN'] | default('')) | length > 0
    fail_msg: >-
      Could not read back the VLESS_WS_CDN inbound UUID from
      /api/config-profiles/inbounds. Verify the read-back path + that the tags in
      remnawave_bootstrap_cdn_inbounds match what the panel returns.

- name: Summarize the Config Profile + inbound UUIDs (copy into node-deploy vars)
  debug:
    msg:
      - "Config Profile '{{ remnawave_bootstrap_config_profile_name }}' ready."
      - "remnawave_panel_config_profile_uuid: {{ remnawave_panel_config_profile_uuid }}"
      - "WS inbound  (VLESS_WS_CDN):    {{ remnawave_bootstrap_inbound_uuids['VLESS_WS_CDN'] | default('(none)') }}"
      - "Reality inbound (VLESS_REALITY): {{ remnawave_reality_inbound_uuid | default('(disabled)') }}"
      - "relay inbound (VLESS_RELAY_REALITY): {{ remnawave_relay_inbound_uuid | default('(disabled)') }}"
      - "relay inbound listens ON THE NODE at 0.0.0.0:{{ remnawave_bootstrap_relay_listen_port | default(443) }} — point your external L4 proxy's backend there."
