---
# tasks/providers/remnawave/relay_node_addresses.yml
#
# Sets _relay_node_addresses: every address that identifies THIS node, in any form
# a caller might paste into remnawave_relay_address.
#
# Factored out because the relay anti-leak invariant has to hold at more than one
# point: create_relay_host.yml enforces it as the shared choke point, and
# migrate.yml has to enforce it in its destination PRE-FLIGHT — reaching the choke
# point only after the transfer would abort with the old relay already offline and
# a normal retry blocked by the clean-destination check. One definition, so the two
# cannot drift (they already did once).
#
# Every source is defaulted: with facts ungathered this degrades to the hostname
# comparison rather than failing.

- name: Collect this node's own addresses (relay anti-leak check)
  set_fact:
    _relay_node_addresses: >-
      {{ ([dns_hostname | default(''),
           ansible_facts['default_ipv4']['address'] | default(''),
           ansible_facts['default_ipv6']['address'] | default('')]
          + (ansible_facts['all_ipv4_addresses'] | default([]))
          + (ansible_facts['all_ipv6_addresses'] | default([]))
          + ((envoy_mappings[inventory_hostname]['ipv4'] | default([]))
             if ((envoy_mappings | default({})) is mapping and (inventory_hostname in (envoy_mappings | default({})))) else [])
          + ((envoy_mappings[inventory_hostname]['ipv6'] | default([]))
             if ((envoy_mappings | default({})) is mapping and (inventory_hostname in (envoy_mappings | default({})))) else []))
         | select('string') | reject('equalto', '') | list }}
