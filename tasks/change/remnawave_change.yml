---
# tasks/change/remnawave_change.yml - Hostname rotation for Remnawave nodes.
#
# Steps:
#   1. Read OLD hostname from {{ remnawave_node_install_dir }}/.hostname
#      (and OLD UUID from .node_uuid if present).
#   2. Generate NEW hostname (dictionary words or custom_hostname).
#   3. Create NEW DNS records pointing to this host.
#   4. Re-template /opt/remnanode/.hostname (and Caddyfile if Caddy is enabled).
#   5. Update Panel-side `address` via PATCH /api/nodes when register_node is on.
#      Otherwise emit a clear manual-step warning. (The panel feeds FCP; the role
#      does not touch FCP for Remnawave node rotation.)
#   6. Optionally delete OLD DNS records.
#
# Container restart is normally NOT required — Remnawave has no internal
# hostname state. However, if Caddy is enabled we reload the Caddyfile
# (handler picks it up) so the new hostname's cert is provisioned.

# ============================================================================
# STEP 0: per-domain credentials
# ============================================================================
- name: Set domain-specific Cloudflare credentials
  set_fact:
    cf_token: "{{ domain_providers[change_target_domain].cloudflare_api_token | default(cloudflare_api_token | default('')) }}"

# ============================================================================
# STEP 1: Read existing state
# ============================================================================
- name: Stat OLD hostname file
  stat:
    path: "{{ remnawave_node_install_dir }}/.hostname"
  register: old_hostname_file_stat
  become: yes

- name: Fail if .hostname missing and no old_dns_hostname override given
  fail:
    msg: >-
      {{ remnawave_node_install_dir }}/.hostname not found. This Remnawave host
      predates hostname persistence or was installed manually. Re-supply the
      current FQDN via --extra-vars old_dns_hostname=<fqdn>, or re-deploy.
  when:
    - not old_hostname_file_stat.stat.exists
    - old_dns_hostname is not defined

- name: Read OLD hostname from disk
  slurp:
    src: "{{ remnawave_node_install_dir }}/.hostname"
  register: old_hostname_raw
  become: yes
  when: old_hostname_file_stat.stat.exists

- name: Set OLD hostname facts (from disk)
  set_fact:
    old_dns_hostname: "{{ old_hostname_raw.content | b64decode | trim }}"
    old_random_hostname: "{{ (old_hostname_raw.content | b64decode | trim).split('.')[0] }}"
    old_base_domain: "{{ (old_hostname_raw.content | b64decode | trim).split('.')[1:] | join('.') }}"
  when: old_hostname_file_stat.stat.exists

# .hostname may hold the suffixed Fastly origin FQDN — the CLEAN node name
# (Host remarks, squad names, FCP slug) lives in .node_name. Fall back to the
# .hostname-derived value for pre-persistence deploys (whose .hostname was the
# clean FQDN anyway).
- name: Read OLD clean node name (if persisted)
  slurp:
    src: "{{ remnawave_node_install_dir }}/.node_name"
  register: old_node_name_raw
  become: yes
  failed_when: false

- name: Prefer the persisted clean node name
  set_fact:
    old_random_hostname: "{{ old_node_name_raw.content | b64decode | trim }}"
  when:
    - old_node_name_raw.content is defined
    - (old_node_name_raw.content | b64decode | trim) | length > 0

- name: Set OLD hostname facts (from old_dns_hostname override)
  set_fact:
    old_random_hostname: "{{ old_dns_hostname.split('.')[0] }}"
    old_base_domain: "{{ old_dns_hostname.split('.')[1:] | join('.') }}"
  when:
    - not old_hostname_file_stat.stat.exists
    - old_dns_hostname is defined

- name: Read OLD node UUID (if present)
  slurp:
    src: "{{ remnawave_node_install_dir }}/.node_uuid"
  register: old_uuid_raw
  become: yes
  failed_when: false

- name: Set OLD node UUID fact
  set_fact:
    remnawave_node_uuid: "{{ old_uuid_raw.content | b64decode | trim }}"
  when:
    - old_uuid_raw.content is defined
    - (old_uuid_raw.content | b64decode | trim) | length > 0

- name: Read the relay marker (if present)
  stat:
    path: "{{ remnawave_node_install_dir }}/.relay_address"
  register: change_relay_marker
  become: yes

- name: Read the persisted relay endpoint (if present)
  slurp:
    src: "{{ remnawave_node_install_dir }}/.relay_address"
  register: change_relay_raw
  become: yes
  failed_when: false

# Change mode has NO on-disk capability detection of its own (unlike migrate), so
# a rotation that forgets to re-pass the transport flags silently skips both Host
# create and cleanup and leaves the old Host pointing at a deleted DNS name. The
# relay marker closes that hole for relay: disk evidence OR the caller's var
# counts. Two set_facts — the parse reads the materialized text, and chaining
# them in one task mis-evaluates under 2.19 lazy templating.
- name: Materialize the persisted relay endpoint text
  set_fact:
    _change_relay_text: >-
      {{ (change_relay_raw.content | b64decode) if change_relay_raw.content is defined else '' }}

# Backslash-free patterns on purpose (see tasks/migrate/migrate.yml for why), and
# the caller's vars win over disk so an operator can re-point the edge in the same
# run that rotates the hostname.
- name: Derive the effective relay facts for this rotation
  set_fact:
    _change_relay_effective: >-
      {{ (remnawave_relay_enabled | default(false) | bool)
         or (change_relay_marker.stat.exists | default(false) | bool) }}
    _change_relay_address: >-
      {{ remnawave_relay_address
         if ((remnawave_relay_address | default('')) | length > 0)
         else ((_change_relay_text | regex_search('^address=.+', multiline=true) | default('', true))
               | regex_replace('^address=', '')) }}
    # Precedence: an explicitly-supplied port wins, else the port persisted on
    # disk, else 443. remnawave_relay_port defaults to EMPTY precisely so the
    # first branch is a real test — with a concrete 443 default it was always
    # true, so a node on a non-443 edge port silently got rewritten to 443 here
    # and in the marker.
    _change_relay_port: >-
      {{ remnawave_relay_port
         if ((remnawave_relay_port | default('')) | string | length > 0)
         else (((_change_relay_text | regex_search('^port=[0-9]+', multiline=true) | default('', true))
                | regex_replace('^port=', '')) | default('443', true)) }}

- name: Debug existing state
  debug:
    msg:
      - "Old hostname: {{ old_dns_hostname }}"
      - "Old random part: {{ old_random_hostname }}"
      - "Old base domain: {{ old_base_domain }}"
      - "Old node UUID: {{ remnawave_node_uuid | default('(none — register_node was not used at deploy)') }}"
      - "Relay node: {{ _change_relay_effective }}{{ ' (edge ' ~ _change_relay_address ~ ':' ~ _change_relay_port ~ ')' if (_change_relay_effective | bool) else '' }}"

# ============================================================================
# STEP 1b: relay pre-flight — BEFORE any mutation
# ============================================================================
# The deploy-mode validations live inside main.yml's `operation_mode == 'deploy'`
# block and never run here, so relay's invariants have to be re-asserted. All of
# these fail BEFORE the new hostname is generated and long before cleanup_hosts
# runs, so a bad invocation can never delete the old Host without a replacement.
- name: Validate relay is not combined with Caddy or Fastly (rotation)
  fail:
    msg: |
      This node is a relay node but remnawave_caddy_enabled=true and/or the
      target domain's cdn_provider is fastly. Relay terminates REALITY on the
      node itself and contends for :443; Fastly cannot forward raw TCP.
  when:
    - _change_relay_effective | bool
    - (remnawave_caddy_enabled | default(false) | bool) or (effective_cdn_provider | default('none') == 'fastly')

- name: Validate the relay endpoint is known before rotating
  fail:
    msg: |
      This node is a relay node (marker:
      {{ remnawave_node_install_dir }}/.relay_address) but no proxy edge address
      is available: nothing on disk and no remnawave_relay_address passed.

      Re-supply it:
        -e remnawave_relay_address=<proxy edge> -e remnawave_relay_port=<port>

      Without it the rotation would publish THIS NODE's hostname to every
      subscriber instead of the proxy edge, bypassing the proxy entirely.
  when:
    - _change_relay_effective | bool
    - (_change_relay_address | default('')) | length == 0

- name: Validate the relay inbound UUID and SNI are available before rotating
  fail:
    msg: |
      This node is a relay node but remnawave_relay_inbound_uuid and/or
      remnawave_relay_sni is unset, so the new relay Host cannot be created —
      and cleanup would then remove the old Host with nothing to replace it.
      Load your generated bootstrap vars file for this rotation:
        -e @<env>-remnawave.generated.yml
  when:
    - _change_relay_effective | bool
    - >-
      ((remnawave_relay_inbound_uuid | default('')) | length == 0)
      or ((remnawave_relay_sni | default('')) | length == 0)

# The manual-repoint gate. Rotation happens on the SAME machine, so the node's IP
# does not move: if the proxy console's origin is that IP, nothing outside the
# panel needs touching. If it holds the FQDN, change_delete_old_dns destroys the
# old name in THIS run and the relay breaks for every user on it — unrecoverable
# by re-running. So: hard-fail only in that combination, warn otherwise.
- name: Require acknowledgement before deleting the old DNS name of a relay node
  fail:
    msg: |
      Relay repoint acknowledgement required.

      This rotation will DELETE the old DNS name ({{ old_dns_hostname }}) because
      change_delete_old_dns=true. If your proxy console's origin is set to that
      FQDN, the relay breaks the moment this run finishes and re-running the role
      cannot repair it.

        node IP        : {{ ansible_facts['default_ipv4']['address'] | default('(unknown)') }}
        old origin     : {{ old_dns_hostname }}
        new origin     : {{ dns_hostname | default('(not yet generated)') }}
        proxy edge     : {{ _change_relay_address }}:{{ _change_relay_port }}
        node-side port : {{ remnawave_relay_node_listen_port | default(443) }}

      If the console origin is the node's IP:      nothing changes — re-run with
        -e remnawave_relay_repoint_ack=true
      If the console origin is the old FQDN:       update it to the new origin
        FIRST (or switch it to the IP), then re-run with the same flag.
      To keep the old name alive instead:          -e change_delete_old_dns=false
  when:
    - _change_relay_effective | bool
    - change_delete_old_dns | default(false) | bool
    - not (remnawave_relay_repoint_ack | default(false) | bool)

- name: Warn that a relay node's origin is changing (old DNS name retained)
  debug:
    msg: |
      RELAY REPOINT NOTICE — this node's origin name is rotating.
        old origin : {{ old_dns_hostname }}
        new origin : {{ dns_hostname | default('(not yet generated)') }}
        proxy edge : {{ _change_relay_address }}:{{ _change_relay_port }} (UNCHANGED — clients keep working)
      The old DNS name is being KEPT (change_delete_old_dns is false), so an
      IP-origin or old-FQDN-origin proxy config both keep resolving. Update the
      proxy console's origin to the new name at your convenience; the role cannot
      do it for you.
  when:
    - _change_relay_effective | bool
    - not (change_delete_old_dns | default(false) | bool)

# ============================================================================
# STEP 2: Generate NEW hostname
# ============================================================================
- name: Install wamerican package for word list
  apt:
    name: wamerican
    state: present
  become: yes
  when: custom_hostname is not defined

- name: Get random words from system dictionary
  shell: 'grep "^[a-z]\{3,8\}$" /usr/share/dict/words | tr "[:upper:]" "[:lower:]" | shuf -n {{ hostname_word_count }}'
  register: random_words
  when: custom_hostname is not defined

- name: Set NEW hostname facts (random)
  set_fact:
    random_hostname: "{{ random_words.stdout_lines | join('-') }}"
    dns_hostname: "{{ random_words.stdout_lines | join('-') }}.{{ change_target_domain }}"
    kv_hostname: "{{ random_words.stdout_lines | join('-') }}"
  when: custom_hostname is not defined

- name: Set NEW hostname facts (custom)
  set_fact:
    random_hostname: "{{ custom_hostname }}"
    dns_hostname: "{{ custom_hostname }}.{{ change_target_domain }}"
    kv_hostname: "{{ custom_hostname }}"
  when: custom_hostname is defined

- name: Override base_domain to NEW target
  set_fact:
    base_domain: "{{ change_target_domain }}"
    api_domain: "{{ change_target_domain }}"
    prom_domain: "{{ change_target_domain }}"

# Fresh per-rotation origin identity (new suffix → new origin FQDN). In shared
# + fronting modes this RESHAPES dns_hostname before the DNS pre-delete below,
# so the only new A record is the unguessable origin.
- name: Derive the Fastly origin identity
  include_tasks: ../providers/fastly/origin_identity.yml
  when: effective_cdn_provider | default('none') == 'fastly'

- name: Debug NEW hostname
  debug:
    msg:
      - "New hostname: {{ dns_hostname }}"
      - "New random part: {{ random_hostname }}"

# ============================================================================
# STEP 3: Create NEW DNS records
# ============================================================================
- name: Override dns_proxied for Fastly CDN (avoid double-CDN)
  set_fact:
    dns_proxied: false
  when: effective_cdn_provider | default('none') == 'fastly'

- name: Override dns_proxied for Reality (direct raw-TLS — no proxy)
  set_fact:
    dns_proxied: false
  when: remnawave_reality_enabled | default(false) | bool

# A proxied record breaks BOTH legs: the L4 proxy cannot dial the origin through
# Cloudflare on an arbitrary port, and the panel cannot reach :2222.
- name: Override dns_proxied for relay (edge proxy + panel dial the node directly)
  set_fact:
    dns_proxied: false
  when: _change_relay_effective | default(false) | bool

# Pre-delete any existing records for the NEW hostname (re-run / custom_hostname
# reuse would otherwise 400 on duplicates) — mirrors outline_change.yml.
- name: Get existing DNS records for new hostname (Cloudflare)
  uri:
    url: "{{ cloudflare_api_endpoint }}/zones/{{ effective_zone_id }}/dns_records?name={{ dns_hostname }}"
    method: GET
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{ cf_token }}"
    status_code: 200
  delegate_to: localhost
  no_log: true  # carries the Cloudflare API token in the Authorization header
  register: existing_dns_records
  when: effective_dns_provider == 'cloudflare'

- name: Delete existing DNS records for new hostname (Cloudflare)
  uri:
    url: "{{ cloudflare_api_endpoint }}/zones/{{ effective_zone_id }}/dns_records/{{ item.id }}"
    method: DELETE
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{ cf_token }}"
    status_code: 200
  delegate_to: localhost
  no_log: true  # carries the Cloudflare API token in the Authorization header
  loop: "{{ existing_dns_records.json.result | default([]) }}"
  when:
    - effective_dns_provider == 'cloudflare'
    - existing_dns_records.json.result | default([]) | length > 0

- name: Include DNS tasks (Cloudflare)
  include_tasks: ../providers/cloudflare/dns.yml
  when: effective_dns_provider == 'cloudflare'

# ============================================================================
# STEP 4: Update local hostname file + Caddyfile
# ============================================================================
- name: Update persisted hostname file
  copy:
    content: "{{ dns_hostname }}\n"
    dest: "{{ remnawave_node_install_dir }}/.hostname"
    mode: '0640'
  become: yes

- name: Persist the NEW clean node name
  copy:
    content: "{{ random_hostname }}\n"
    dest: "{{ remnawave_node_install_dir }}/.node_name"
    mode: '0640'
  become: yes

# Re-persist the relay marker so a later change/migrate/wipe still sees it (and
# picks up an endpoint the operator re-pointed in this run). Deliberately NO
# state=absent counterpart here: change mode is not authoritative about capability
# flags, so a caller who simply omitted the relay vars must not have the marker
# deleted out from under them.
- name: Re-persist the relay endpoint (relay marker)
  copy:
    content: |
      address={{ _change_relay_address }}
      port={{ _change_relay_port | int }}
    dest: "{{ remnawave_node_install_dir }}/.relay_address"
    mode: '0640'
  become: "{{ remnawave_persist_become | default(true) }}"
  when:
    - _change_relay_effective | default(false) | bool
    - (_change_relay_address | default('')) | length > 0

- name: Ensure decoy site exists before re-render
  include_tasks: ../setup/decoy.yml
  when: remnawave_caddy_enabled | default(false) | bool

- name: Re-render Caddyfile with new hostname
  template:
    src: remnanode-caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: '0644'
    validate: "caddy validate --config %s --adapter caddyfile"
  become: yes
  notify: reload caddy
  when: remnawave_caddy_enabled | default(false) | bool

- name: Flush handlers (reload Caddy now)
  meta: flush_handlers

# ============================================================================
# STEP 4b: Fastly service rotation + Host re-pointing (Fastly-fronted only)
# ============================================================================
# The rotated hostname changes the Fastly edge domain, so the old Fastly service
# and the old Hosts are stale. NEW objects are created BEFORE the old ones are
# deleted — a mid-run failure then leaves the OLD edge/Hosts serving instead of
# a void. Exception: an UNCHANGED hostname reuses the SAME service name (the
# service is named after the hostname), so the old service must be deleted
# first (the create would otherwise reuse it with a stale backend) — a
# documented brief edge gap, self-healed by re-running.
- name: Set Fastly service-id persistence dir (Remnawave)
  set_fact:
    fastly_service_id_dir: "{{ remnawave_node_install_dir }}"
  when: effective_cdn_provider | default('none') == 'fastly'

- name: Set Fastly credentials for change mode
  set_fact:
    fastly_token: "{{ domain_providers[change_target_domain].fastly_api_token | default(fastly_api_token | default('')) }}"
  when: effective_cdn_provider | default('none') == 'fastly'

# Capture the OLD service id BEFORE service.yml overwrites the id file below.
- name: Read the OLD Fastly service id (pre-rotation)
  slurp:
    src: "{{ remnawave_node_install_dir }}/fastly_service_id"
  register: _old_fastly_service_id_raw
  become: yes
  failed_when: false
  when: effective_cdn_provider | default('none') == 'fastly'

- name: Set the OLD Fastly service id fact
  set_fact:
    old_fastly_service_id: "{{ _old_fastly_service_id_raw.content | b64decode | trim }}"
  when:
    - effective_cdn_provider | default('none') == 'fastly'
    - _old_fastly_service_id_raw.content is defined
    - (_old_fastly_service_id_raw.content | b64decode | trim) | length > 0

# Same for the OLD origin FQDN — service.yml rewrites the persisted file with
# the NEW origin below; the old origin's DNS record is deleted in STEP 6.
- name: Read the OLD Fastly origin FQDN (pre-rotation)
  slurp:
    src: "{{ remnawave_node_install_dir }}/fastly_origin_fqdn"
  register: _old_fastly_origin_raw
  become: yes
  failed_when: false
  when: effective_cdn_provider | default('none') == 'fastly'

- name: Set the OLD Fastly origin FQDN fact
  set_fact:
    old_fastly_origin_fqdn: "{{ _old_fastly_origin_raw.content | b64decode | trim }}"
  when:
    - effective_cdn_provider | default('none') == 'fastly'
    - _old_fastly_origin_raw.content is defined
    - (_old_fastly_origin_raw.content | b64decode | trim) | length > 0

# Same for the OLD generated edge FQDNs — service.yml persists the NEW list;
# cleanup_edges.yml retires the old ones at the end of the rotation.
- name: Read the OLD generated Fastly edge domains (pre-rotation)
  slurp:
    src: "{{ remnawave_node_install_dir }}/fastly_edge_domains"
  register: _old_fastly_edges_raw
  become: yes
  failed_when: false
  when: effective_cdn_provider | default('none') == 'fastly'

- name: Set the OLD generated edge list fact
  set_fact:
    old_fastly_edge_domains: "{{ (_old_fastly_edges_raw.content | b64decode).split('\n') | select('string') | reject('equalto', '') | list }}"
  when:
    - effective_cdn_provider | default('none') == 'fastly'
    - _old_fastly_edges_raw.content is defined

# The service is named after the hostname — a rotation to a NEW hostname is
# always a new-name create (old service deleted AFTER). Only an unchanged
# hostname (re-run / custom_hostname reuse) reuses the same name — then the old
# service must be deleted first (the create would otherwise reuse it with a
# stale backend) — a documented brief edge gap, self-healed by re-running.
- name: Note same-name Fastly rotation (hostname unchanged)
  set_fact:
    _fastly_same_name_rotation: true
  when:
    - effective_cdn_provider | default('none') == 'fastly'
    - random_hostname == old_random_hostname

- name: Set the OLD Fastly edge domain for TLS cleanup (custom mode)
  set_fact:
    fastly_cleanup_domain: "{{ old_dns_hostname }}"
  when:
    - effective_cdn_provider | default('none') == 'fastly'
    - effective_fastly_domain_mode | default('shared') == 'custom'

- name: Delete OLD Fastly service (same-name rotation must go first)
  include_tasks: ../providers/fastly/cleanup.yml
  when:
    - effective_cdn_provider | default('none') == 'fastly'
    - _fastly_same_name_rotation | default(false) | bool

- name: Create NEW Fastly service for the rotated hostname
  include_tasks: ../providers/fastly/service.yml
  when:
    - effective_cdn_provider | default('none') == 'fastly'
    - remnawave_caddy_enabled | default(false) | bool

- name: Fastly TLS subscription (custom domain mode)
  include_tasks: ../providers/fastly/tls.yml
  when:
    - effective_cdn_provider | default('none') == 'fastly'
    - effective_fastly_domain_mode | default('shared') == 'custom'

- name: Fastly edge CNAME (custom domain mode)
  include_tasks: ../providers/fastly/dns.yml
  when:
    - effective_cdn_provider | default('none') == 'fastly'
    - effective_fastly_domain_mode | default('shared') == 'custom'
    - effective_dns_provider == 'cloudflare'

- name: Create NEW Remnawave Hosts for the rotated hostname
  include_tasks: ../providers/remnawave/create_hosts.yml
  when:
    - remnawave_panel_register_node | default(false) | bool
    - remnawave_caddy_enabled | default(false) | bool
    - effective_cdn_provider | default('none') in ['fastly', 'none']

- name: Create NEW Reality Host for the rotated hostname
  include_tasks: ../providers/remnawave/create_reality_host.yml
  when:
    - remnawave_panel_register_node | default(false) | bool
    - remnawave_reality_enabled | default(false) | bool

# The relay Host's ADDRESS (the proxy edge) does not rotate — only its remark
# does. It still has to be re-created: cleanup_hosts.yml and the wipe path find
# Hosts solely by hostname-anchored remark, so a Host left under the old remark
# becomes permanently unreachable to the role and is orphaned at the next
# teardown. The endpoint is passed as a single-level include var; a
# self-referential set_fact on remnawave_relay_address would recurse under 2.19.
- name: Create NEW relay Host for the rotated hostname
  include_tasks: ../providers/remnawave/create_relay_host.yml
  vars:
    remnawave_relay_address: "{{ _change_relay_address }}"
    remnawave_relay_port: "{{ _change_relay_port }}"
  when:
    - remnawave_panel_register_node | default(false) | bool
    - _change_relay_effective | default(false) | bool

# Old objects come down only after their replacements exist.
- name: Clean up OLD Remnawave Hosts on the panel
  include_tasks: ../providers/remnawave/cleanup_hosts.yml
  when:
    - remnawave_panel_register_node | default(false) | bool
    - >-
      (remnawave_caddy_enabled | default(false) | bool)
      or (remnawave_reality_enabled | default(false) | bool)
      or (_change_relay_effective | default(false) | bool)

- name: Delete OLD Fastly service (after the NEW one is live)
  include_tasks: ../providers/fastly/cleanup.yml
  when:
    - effective_cdn_provider | default('none') == 'fastly'
    - not (_fastly_same_name_rotation | default(false) | bool)

# Old generated edges come down only after the new ones are live (their TLS
# subscriptions + edge CNAMEs), so a mid-run failure leaves the old edges
# serving. Exact fastly_fronting_domains are never touched.
- name: Retire OLD generated Fastly edges (DNS + TLS subscription)
  include_tasks: ../providers/fastly/cleanup_edges.yml
  when:
    - effective_cdn_provider | default('none') == 'fastly'
    - old_fastly_edge_domains | default([]) | length > 0

# ============================================================================
# STEP 5: Update Panel-side address
# ============================================================================
- name: Update node address on Panel
  include_tasks: ../providers/remnawave/update_node.yml
  when:
    - remnawave_panel_register_node | default(false) | bool
    - remnawave_node_uuid is defined
    - remnawave_node_uuid | length > 0

- name: Warn that Panel must be updated manually
  debug:
    msg: |
      ⚠️  Manual step required:
      remnawave_panel_register_node is false (or no .node_uuid was found).
      Open the Panel UI → Nodes → find the entry for {{ old_dns_hostname }}
      and update its 'Address' field to '{{ dns_hostname }}'.
      The role cannot do this automatically without Panel API access.
  when: >-
    not (remnawave_panel_register_node | default(false) | bool)
    or remnawave_node_uuid is not defined
    or remnawave_node_uuid | length == 0

# ============================================================================
# STEP 6: Optional cleanup of old DNS records
# ============================================================================
# Server-side ?name= filter (mirrors outline_change.yml) returns only records
# for the exact old hostname — Remnawave creates no -api/-prom subdomains
# (no tunnel), so exact-name is complete and avoids client-side regex matching.
# Note: Remnawave hostname rotation does NOT touch FCP. FCP holds only the panel
# (baseUrl+apiToken), which is unchanged; the node's NEW address is pushed to the
# panel via the update_node PATCH in STEP 5, and the panel feeds FCP.
# The OLD domain may live in a different Cloudflare account than the NEW one —
# resolve its own credentials (falling back to the new domain's token).
- name: Set OLD-domain Cloudflare credentials
  set_fact:
    old_cf_token: "{{ domain_providers[old_base_domain].cloudflare_api_token | default(cf_token) }}"
  when: old_base_domain in domain_providers

- name: Warn when old-domain DNS cleanup is skipped (domain not managed)
  debug:
    msg: >-
      change_delete_old_dns is on, but the OLD domain '{{ old_base_domain }}'
      has no domain_providers entry — the old records for
      {{ old_dns_hostname }} are LEFT IN PLACE. Add the zone to
      domain_providers or delete the records manually.
  when:
    - change_delete_old_dns | default(true) | bool
    - old_base_domain not in domain_providers
    - old_dns_hostname != dns_hostname

- name: Get OLD-domain DNS records
  uri:
    url: "{{ cloudflare_api_endpoint }}/zones/{{ domain_providers[old_base_domain].zone_id }}/dns_records?name={{ old_dns_hostname }}"
    method: GET
    headers:
      Authorization: "Bearer {{ old_cf_token }}"
    status_code: 200
  delegate_to: localhost
  no_log: true  # carries the Cloudflare API token in the Authorization header
  register: old_dns_records
  when:
    - change_delete_old_dns | default(true) | bool
    - old_base_domain in domain_providers
    - old_dns_hostname != dns_hostname

- name: Delete OLD DNS records for {{ old_dns_hostname }}
  uri:
    url: "{{ cloudflare_api_endpoint }}/zones/{{ domain_providers[old_base_domain].zone_id }}/dns_records/{{ item.id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ old_cf_token }}"
    status_code: [200, 404]
  delegate_to: localhost
  no_log: true  # carries the Cloudflare API token in the Authorization header
  loop: "{{ old_dns_records.json.result | default([]) }}"
  loop_control:
    label: "{{ item.name }} ({{ item.type }})"
  when:
    - change_delete_old_dns | default(true) | bool
    - old_base_domain in domain_providers
    - old_dns_records is defined
    - old_dns_records.json is defined
    - old_dns_hostname != dns_hostname

# The old Fastly ORIGIN record is a distinct name from old_dns_hostname in
# legacy custom mode (origin-<old> pre-P2; <old>-<suffix> persisted post-P2) —
# delete it too or the retired origin stays resolvable. In shared/fronting
# mode the origin IS old_dns_hostname (deleted above) and these GETs no-op.
- name: Compute OLD origin record candidates
  set_fact:
    _old_origin_candidates: >-
      {{ ([old_fastly_origin_fqdn | default(''),
           'origin-' ~ old_random_hostname ~ '.' ~ old_base_domain]
         | reject('equalto', '') | unique | list)
         | reject('equalto', old_dns_hostname) | list }}
  when:
    - change_delete_old_dns | default(true) | bool
    - old_base_domain in domain_providers

- name: Get OLD origin DNS records
  uri:
    url: "{{ cloudflare_api_endpoint }}/zones/{{ domain_providers[old_base_domain].zone_id }}/dns_records?name={{ item }}"
    method: GET
    headers:
      Authorization: "Bearer {{ old_cf_token }}"
    status_code: 200
  delegate_to: localhost
  no_log: true  # carries the Cloudflare API token in the Authorization header
  register: _old_origin_records
  loop: "{{ _old_origin_candidates | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - change_delete_old_dns | default(true) | bool
    - old_base_domain in domain_providers
    - _old_origin_candidates | default([]) | length > 0

- name: Delete OLD origin DNS records
  uri:
    url: "{{ cloudflare_api_endpoint }}/zones/{{ domain_providers[old_base_domain].zone_id }}/dns_records/{{ item.1.id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ old_cf_token }}"
    status_code: [200, 404]
  delegate_to: localhost
  no_log: true  # carries the Cloudflare API token in the Authorization header
  loop: "{{ (_old_origin_records.results | default([])) | subelements('json.result', skip_missing=True) | list }}"
  loop_control:
    label: "{{ item.1.name }} ({{ item.1.type }})"
  when:
    - change_delete_old_dns | default(true) | bool
    - old_base_domain in domain_providers
    - old_dns_hostname != dns_hostname

- name: Display change summary
  debug:
    msg: |
      Hostname rotation complete!

      Old: {{ old_dns_hostname }}
      New: {{ dns_hostname }}
      {% if _change_relay_effective | default(false) | bool %}

      RELAY NODE — the client-facing edge did NOT change:
        clients still dial : {{ _change_relay_address }}:{{ _change_relay_port }}
        proxy backend must now point at:
          {{ dns_hostname }}:{{ remnawave_relay_node_listen_port | default(443) }}   (raw TCP)
        old origin : {{ old_dns_hostname }}{{ ' (DELETED in this run)' if (change_delete_old_dns | default(false) | bool) else ' (retained)' }}
        node IP    : {{ ansible_facts['default_ipv4']['address'] | default('(unknown)') }}

      If the proxy console's origin is the node IP, nothing needs doing. If it
      holds the old FQDN, update it now — the role cannot reach your proxy
      provider.
      {% endif %}
