---
# tasks/update/remnawave_update.yml - Update mode tasks for Remnawave hosts.
#
# Triggered when update_component == 'remnawave' (set in tasks/main.yml).
# Reads existing state from /opt/remnanode/ and re-templates / recreates the
# container if force_reinstall_remnawave is set.

# === Read existing state ===
- name: Stat persisted hostname file
  stat:
    path: "{{ remnawave_node_install_dir }}/.hostname"
  register: hostname_file_stat
  become: yes

- name: Fail if .hostname is missing and no dns_hostname override given
  fail:
    msg: >-
      {{ remnawave_node_install_dir }}/.hostname not found. This Remnawave host
      predates hostname persistence or was installed manually. Re-supply the
      deployed FQDN via --extra-vars dns_hostname=<fqdn>, or re-deploy.
  when:
    - not hostname_file_stat.stat.exists
    - dns_hostname is not defined

- name: Read deployed hostname from disk
  slurp:
    src: "{{ remnawave_node_install_dir }}/.hostname"
  register: existing_hostname_raw
  become: yes
  when: hostname_file_stat.stat.exists

- name: Set hostname facts from disk
  set_fact:
    dns_hostname: "{{ existing_hostname_raw.content | b64decode | trim }}"
    random_hostname: "{{ (existing_hostname_raw.content | b64decode | trim).split('.')[0] }}"
    kv_hostname: "{{ (existing_hostname_raw.content | b64decode | trim).split('.')[0] }}"
    base_domain: "{{ (existing_hostname_raw.content | b64decode | trim).split('.')[1:] | join('.') }}"
  when: hostname_file_stat.stat.exists

# .hostname may hold the suffixed Fastly origin FQDN — the CLEAN node name
# lives in .node_name (pre-persistence deploys fall back to the derived value).
- name: Read the persisted clean node name (if present)
  slurp:
    src: "{{ remnawave_node_install_dir }}/.node_name"
  register: existing_node_name_raw
  become: yes
  failed_when: false

- name: Prefer the persisted clean node name
  set_fact:
    random_hostname: "{{ existing_node_name_raw.content | b64decode | trim }}"
    kv_hostname: "{{ existing_node_name_raw.content | b64decode | trim }}"
  when:
    - existing_node_name_raw.content is defined
    - (existing_node_name_raw.content | b64decode | trim) | length > 0

- name: Set hostname facts from dns_hostname override (no .hostname file)
  set_fact:
    random_hostname: "{{ dns_hostname.split('.')[0] }}"
    kv_hostname: "{{ dns_hostname.split('.')[0] }}"
    base_domain: "{{ dns_hostname.split('.')[1:] | join('.') }}"
  when:
    - not hostname_file_stat.stat.exists
    - dns_hostname is defined

- name: Read existing node UUID (if present)
  slurp:
    src: "{{ remnawave_node_install_dir }}/.node_uuid"
  register: existing_uuid_raw
  become: yes
  failed_when: false

- name: Set remnawave_node_uuid fact
  set_fact:
    remnawave_node_uuid: "{{ existing_uuid_raw.content | b64decode | trim }}"
  when:
    - existing_uuid_raw.content is defined
    - (existing_uuid_raw.content | b64decode | trim) | length > 0

# Read the relay marker BEFORE the wipe block deletes the install dir — the warn
# below needs the endpoint to tell the operator which proxy is now orphaned.
- name: Read the relay marker (if present)
  stat:
    path: "{{ remnawave_node_install_dir }}/.relay_address"
  register: update_relay_marker
  become: yes

- name: Read the persisted relay endpoint (if present)
  slurp:
    src: "{{ remnawave_node_install_dir }}/.relay_address"
  register: update_relay_raw
  become: yes
  failed_when: false

- name: Materialize the persisted relay endpoint text
  set_fact:
    _update_relay_text: >-
      {{ (update_relay_raw.content | b64decode) if update_relay_raw.content is defined else '' }}

- name: Derive the persisted relay endpoint
  set_fact:
    _update_relay_is_relay: "{{ update_relay_marker.stat.exists | default(false) | bool }}"
    _update_relay_address: >-
      {{ (_update_relay_text | regex_search('^address=.+', multiline=true) | default('', true))
         | regex_replace('^address=', '') }}
    _update_relay_port: >-
      {{ ((_update_relay_text | regex_search('^port=[0-9]+', multiline=true) | default('', true))
          | regex_replace('^port=', '')) | default('443', true) }}

- name: Debug detected state
  debug:
    msg:
      - "Detected Remnawave at {{ remnawave_node_install_dir }}"
      - "dns_hostname: {{ dns_hostname }}"
      - "node_uuid: {{ remnawave_node_uuid | default('(none)') }}"
      - "force_reinstall_remnawave: {{ force_reinstall_remnawave | default(false) | bool }}"
      - "relay node: {{ _update_relay_is_relay }}{{ ' (edge ' ~ _update_relay_address ~ ':' ~ _update_relay_port ~ ')' if (_update_relay_is_relay | bool) else '' }}"

# === DESTRUCTIVE: force_wipe_remnawave — decommission this node entirely ===
# Removes the panel-side node (when uuid + token known), tears down the
# container, and deletes the install dir, then ends the play for THIS host so
# the re-template / slipstream tasks below (and in main.yml) are skipped.
# Gated on a default-false flag, so this is a no-op unless requested.
- name: Wipe Remnawave node (destructive decommission)
  when: force_wipe_remnawave | default(false) | bool
  block:
    - name: Warn — wiping Remnawave node
      debug:
        msg: >-
          force_wipe_remnawave is set. Removing {{ remnawave_node_install_dir }}
          and (if uuid known) deleting node
          {{ remnawave_node_uuid | default('(unknown)') }} from
          {{ remnawave_panel_url | default('(no panel url)') }}.

    # Legacy per-node placement only: detach this node's squad(s) from FCP's
    # mode pools, delete the per-node squads and strip the cloned inbounds.
    # Default model has no per-node squads — the shared squads/pools stay.
    # Reads .squad_uuids from the install dir (still present here) with a panel
    # name fallback. Must run before delete_node and the dir removal below.
    - name: Tear down the per-node placement (FCP pool detach + squad/inbound cleanup)
      include_tasks: ../providers/remnawave/teardown_node_placement.yml
      when:
        - remnawave_per_node_placement | default(false) | bool
        - remnawave_panel_api_token | default('') | length > 0

    - name: Warn that per-node placement teardown is skipped (no panel token)
      debug:
        msg: >-
          Skipped per-node placement teardown — remnawave_panel_api_token is
          empty. This node's squads and their FCP mode-pool entries are LEFT
          pointing at a dead node. Re-run with the panel token, or detach the
          squads from FCP (mode-placements removeSquadUuids) and delete them in
          the Panel UI manually.
      when:
        - remnawave_per_node_placement | default(false) | bool
        - remnawave_panel_api_token | default('') | length == 0

    # Remove this node's Hosts from the panel. Hosts bind the SHARED base
    # inbounds to this node's edge/origin address — leaving them behind means
    # subscriptions keep offering a dead node's endpoint to every user.
    - name: Set the hostname fact for Host cleanup
      set_fact:
        old_random_hostname: "{{ random_hostname }}"
      when: remnawave_panel_api_token | default('') | length > 0

    - name: Delete this node's Remnawave Hosts
      include_tasks: ../providers/remnawave/cleanup_hosts.yml
      when: remnawave_panel_api_token | default('') | length > 0

    # The external L4 proxy is the operator's — the role talks to no proxy
    # provider, so a wiped relay node leaves a proxy dialling a dead origin.
    - name: Warn that the external relay proxy is now orphaned
      debug:
        msg: |
          RELAY PROXY LEFT ORPHANED — manual cleanup required.

          This node was a relay node and has been decommissioned, but its
          external L4 proxy still exists and now forwards to a dead origin:

            proxy edge  : {{ _update_relay_address | default('(unknown)') }}:{{ _update_relay_port | default('443') }}
            dead origin : {{ dns_hostname }}:{{ remnawave_relay_node_listen_port | default(443) }}

          Delete (or re-point) that proxy in your provider console. The role
          cannot do it. Its Hosts have already been removed from the panel, so no
          subscription still advertises this endpoint.
      when:
        - _update_relay_is_relay | default(false) | bool
        - remnawave_panel_api_token | default('') | length > 0

    # Without a token the Host cleanup above was SKIPPED, so the previous message's
    # claim would be false — and false in the dangerous direction, telling an operator
    # no panel cleanup is needed while a live Host still advertises an endpoint whose
    # origin is being destroyed.
    - name: Warn that the relay Host is STILL LIVE (no panel token supplied)
      debug:
        msg: |
          RELAY HOST STILL ADVERTISED — manual panel cleanup required.

          No remnawave_panel_api_token was supplied, so this node's Hosts were NOT
          removed from the panel. Every subscriber still receives:

            remark      : {{ random_hostname }}-relay
            proxy edge  : {{ _update_relay_address | default('(unknown)') }}:{{ _update_relay_port | default('443') }}

          The origin behind that edge is being destroyed by this wipe, so the endpoint
          is about to start failing for everyone holding it. Delete the Host in the
          Panel UI (Hosts → find the '{{ random_hostname }}-' entries), then delete or
          re-point the external proxy in your provider console.
      when:
        - _update_relay_is_relay | default(false) | bool
        - remnawave_panel_api_token | default('') | length == 0

    - name: Delete node on Panel (when uuid + token known)
      include_tasks: ../providers/remnawave/delete_node.yml
      when:
        - remnawave_node_uuid is defined
        - remnawave_node_uuid | length > 0
        - remnawave_panel_api_token | default('') | length > 0

    - name: Warn that Panel node could not be auto-deleted
      debug:
        msg: >-
          Skipped panel-side DELETE — no .node_uuid on disk or no
          remnawave_panel_api_token supplied. Remove the node manually in the
          Panel UI if it still exists.
      when: >-
        remnawave_node_uuid is not defined
        or remnawave_node_uuid | length == 0
        or remnawave_panel_api_token | default('') | length == 0

    - name: Tear down Remnawave container
      community.docker.docker_compose_v2:
        project_src: "{{ remnawave_node_install_dir }}"
        state: absent
        remove_volumes: true
      become: yes
      failed_when: false   # compose file may already be partially gone

    - name: Remove Remnawave install dir + logrotate config
      file:
        path: "{{ item }}"
        state: absent
      become: yes
      loop:
        - "{{ remnawave_node_install_dir }}"
        - /etc/logrotate.d/remnanode

    - name: End play for this host after wipe
      meta: end_host

# === Re-template / recreate container if forced ===
- name: Read existing SECRET_KEY from compose
  slurp:
    src: "{{ remnawave_node_install_dir }}/docker-compose.yml"
  register: existing_compose_raw
  become: yes
  when: force_reinstall_remnawave | default(false) | bool

# Tolerant of both the unquoted form (current template) and the legacy
# quoted form (SECRET_KEY="...") left on disk by hosts deployed before the
# quoting fix, so the first reinstall after the fix also repairs the on-disk
# value. The base64 character class stops at the closing quote or newline.
- name: Extract SECRET_KEY from existing compose
  set_fact:
    remnawave_panel_secret_key: "{{ (existing_compose_raw.content | b64decode | regex_search('SECRET_KEY=\"?([A-Za-z0-9+/=._-]+)\"?', '\\1') | first) }}"
  no_log: true
  when:
    - force_reinstall_remnawave | default(false) | bool
    - existing_compose_raw is defined

- name: Assert SECRET_KEY was recovered from compose
  assert:
    that:
      - remnawave_panel_secret_key is defined
      - remnawave_panel_secret_key | length > 0
    fail_msg: >-
      Could not extract SECRET_KEY from
      {{ remnawave_node_install_dir }}/docker-compose.yml. The compose file may
      be corrupt; re-supply remnawave_panel_secret_key (vault) and re-run.
  no_log: true
  when:
    - force_reinstall_remnawave | default(false) | bool
    - existing_compose_raw is defined

- name: Re-render docker-compose.yml
  template:
    src: remnanode-docker-compose.yml.j2
    dest: "{{ remnawave_node_install_dir }}/docker-compose.yml"
    mode: '0640'
  become: yes
  register: compose_template_update
  no_log: true  # the rendered compose carries the panel-wide SECRET_KEY
  when: force_reinstall_remnawave | default(false) | bool

- name: Pull image (force)
  community.docker.docker_image:
    name: "{{ remnawave_node_image }}"
    source: pull
    force_source: true
  become: yes
  when: force_reinstall_remnawave | default(false) | bool

- name: Recreate container
  community.docker.docker_compose_v2:
    project_src: "{{ remnawave_node_install_dir }}"
    state: present
    recreate: always
  become: yes
  when: force_reinstall_remnawave | default(false) | bool

- name: Wait for NODE_PORT after recreate
  wait_for:
    host: 127.0.0.1
    port: "{{ remnawave_node_port }}"
    timeout: 60
    delay: 2
  when: force_reinstall_remnawave | default(false) | bool

# === Set component_install_success so downstream gates work ===
- name: Mark Remnawave component as ready for downstream tasks
  set_fact:
    remnawave_install_success: true
    component_install_success: true

# Remnawave update does NOT touch FCP. FCP stores only the panel (baseUrl +
# apiToken), which is unchanged when a node is re-templated/recreated. Per-node
# config (transports/Hosts) lives panel-side and is fed to FCP by the panel.

- name: Display Remnawave update summary
  debug:
    msg: |
      Remnawave update complete!

      Server: {{ dns_hostname }}
      Force reinstall: {{ force_reinstall_remnawave | default(false) | bool }}
      Node UUID: {{ remnawave_node_uuid | default('(none)') }}
