---
# tasks/setup/sysctl.yml - the kernel settings the node wants, in ONE drop-in
# of the role's (node_sysctl_file), applied at once and loaded again at boot.
#
#   node_quic_buffers  (default on) raise net.core.rmem_max/wmem_max to
#                      node_quic_buffer_bytes (16 MiB, quic-go's
#                      recommendation): a QUIC transport (Hysteria 2) asks for
#                      larger UDP socket buffers than the kernel allows by
#                      default and drops datagrams under load without them.
#                      Raise only: a larger limit the machine already has is
#                      kept as it is.
#   node_tcp_bbr       (default on) BBR congestion control with the fq qdisc:
#                      net.ipv4.tcp_congestion_control = bbr and
#                      net.core.default_qdisc = fq, tcp_bbr loaded now and at
#                      boot. A kernel that offers no BBR stops the run.
#                      The node container and the front server share the
#                      host's network, so the host's setting is theirs.
#                      default_qdisc only reaches a qdisc when it is made, so
#                      the interfaces of the default routes are given fq at
#                      once (filter_plugins/node_qdisc.py); one that carries a
#                      qdisc the role does not know is left alone.
#                      What the kernel ran before is written down first
#                      (node_sysctl_previous_file) and put back, on the
#                      kernel and on those interfaces, when this is turned off.
#
# Nothing else in /etc/sysctl.d is touched. With both off the drop-in is
# removed; the buffer limits stay as they are until the next boot.

- name: Set the role's sysctl paths
  set_fact:
    _sysctl_file: "{{ node_sysctl_file }}"
    _sysctl_modules_file: "{{ node_sysctl_modules_file }}"
    _sysctl_previous_file: "{{ node_sysctl_previous_file }}"

- name: Validate the buffer size
  assert:
    that:
      - (node_quic_buffer_bytes | string) is match('^[0-9]+$')
      - node_quic_buffer_bytes | int >= 212992
      - node_quic_buffer_bytes | int <= 1073741824
    fail_msg: >-
      node_quic_buffer_bytes must be a number of bytes between 212992 (the
      kernel's usual default) and 1 GiB (got '{{ node_quic_buffer_bytes }}')
    quiet: true
  when: node_quic_buffers | bool

# The reads run with become too: sysctl lives in /usr/sbin, which a non-root
# login's PATH may leave out.
- name: Read the kernel's buffer limits
  command: sysctl -n net.core.rmem_max net.core.wmem_max
  register: _sysctl_buffers
  changed_when: false
  become: "{{ _fcp_become | default(true) }}"
  when: node_quic_buffers | bool

- name: Work out the settings
  set_fact:
    _sysctl_settings: >-
      {{ ({'net.core.rmem_max': [(_sysctl_buffers.stdout_lines[0] | int), (node_quic_buffer_bytes | int)] | max,
           'net.core.wmem_max': [(_sysctl_buffers.stdout_lines[1] | int), (node_quic_buffer_bytes | int)] | max}
          if (node_quic_buffers | bool) else {})
         | combine({'net.core.default_qdisc': 'fq', 'net.ipv4.tcp_congestion_control': 'bbr'}
                   if (node_tcp_bbr | bool) else {}) }}

- name: Load the BBR module now
  command: modprobe tcp_bbr
  register: _sysctl_modprobe
  changed_when: false
  failed_when: false
  become: "{{ _fcp_become | default(true) }}"
  when: node_tcp_bbr | bool

- name: Ask the kernel for BBR
  command: sysctl -n net.ipv4.tcp_available_congestion_control
  register: _sysctl_cc
  changed_when: false
  failed_when: false
  become: "{{ _fcp_become | default(true) }}"
  when: node_tcp_bbr | bool

- name: Note whether BBR can be used
  set_fact:
    _sysctl_bbr: "{{ (node_tcp_bbr | bool) and ('bbr' in ((_sysctl_cc.stdout | default('')).split())) }}"

# The boot file is written only once BBR is known to be there, and removed
# otherwise, so a machine never boots asking for a module it does not have.
- name: Forget the BBR module
  file:
    path: "{{ _sysctl_modules_file }}"
    state: absent
  become: "{{ _fcp_become | default(true) }}"
  when: not (_sysctl_bbr | bool)

- name: Fail closed on a kernel without BBR
  fail:
    msg: >-
      node_tcp_bbr is on but this kernel offers no BBR
      (available: {{ (_sysctl_cc.stdout | default('') | trim) or 'unknown' }}).
      Set node_tcp_bbr: false for this machine, or run a kernel with tcp_bbr.
  when:
    - node_tcp_bbr | bool
    - not (_sysctl_bbr | bool)

- name: Load the BBR module at boot
  copy:
    content: "# Managed by ansible-role-freesocks (node_tcp_bbr).\ntcp_bbr\n"
    dest: "{{ _sysctl_modules_file }}"
    mode: '0644'
  become: "{{ _fcp_become | default(true) }}"
  when: _sysctl_bbr | bool

# What the kernel ran before BBR: the role's record when there is one (BBR is
# or was on), otherwise what the kernel runs now. Written before anything is
# changed, so a run that stops half way still knows what to put back.
- name: Read the role's record of what the kernel ran before BBR
  command: cat {{ _sysctl_previous_file }}
  register: _sysctl_prev_read
  changed_when: false
  failed_when: false
  become: "{{ _fcp_become | default(true) }}"

- name: Read the record
  set_fact:
    _sysctl_prev: >-
      {{ dict((_sysctl_prev_read.stdout | default(''))
              | regex_findall('(?m)^(net[.][a-z0-9_.]+) = ([a-z0-9_]+) *$'))
         if _sysctl_prev_read.rc == 0 else {} }}
    _sysctl_prev_devs: >-
      {{ (_sysctl_prev_read.stdout | default('')) | regex_findall('(?m)^# qdisc: ([^ ]+) *$')
         if _sysctl_prev_read.rc == 0 else [] }}

- name: Read the kernel's congestion control and qdisc
  command: sysctl -n net.core.default_qdisc net.ipv4.tcp_congestion_control
  register: _sysctl_cc_now
  changed_when: false
  become: "{{ _fcp_become | default(true) }}"
  when:
    - _sysctl_bbr | bool
    - _sysctl_prev | length != 2

- name: Note what the kernel ran before BBR
  set_fact:
    _sysctl_prev:
      net.core.default_qdisc: "{{ _sysctl_cc_now.stdout_lines[0] | trim }}"
      net.ipv4.tcp_congestion_control: "{{ _sysctl_cc_now.stdout_lines[1] | trim }}"
  when:
    - _sysctl_bbr | bool
    - _sysctl_prev | length != 2

- name: Find the interfaces of the default routes
  command: ip -o {{ item }} route show default
  loop: ['-4', '-6']
  register: _sysctl_routes
  changed_when: false
  failed_when: false
  become: "{{ _fcp_become | default(true) }}"
  when: _sysctl_bbr | bool

# BBR on: the default routes' interfaces. BBR off: the ones the role gave fq.
- name: Note the interfaces to look at
  set_fact:
    _sysctl_devs: >-
      {{ (_sysctl_routes.results | map(attribute='stdout', default='') | join(' ')
          | regex_findall(' dev ([^ ]+)') | unique | sort)
         if (_sysctl_bbr | bool)
         else (_sysctl_prev_devs if (_sysctl_prev | length == 2) else []) }}

- name: Read their qdiscs
  command: tc -j qdisc show dev {{ item }}
  loop: "{{ _sysctl_devs }}"
  register: _sysctl_qdiscs
  changed_when: false
  failed_when: false
  become: "{{ _fcp_become | default(true) }}"

- name: Work out which interfaces change qdisc
  set_fact:
    _sysctl_qdisc_plan: >-
      {{ (_sysctl_qdiscs.results
          | node_qdisc_plan('fq', ['pfifo_fast', 'fq_codel', 'pfifo', _sysctl_prev['net.core.default_qdisc']]))
         if (_sysctl_bbr | bool)
         else ((_sysctl_qdiscs.results | node_qdisc_plan(_sysctl_prev['net.core.default_qdisc'], ['fq']))
               if (_sysctl_prev | length == 2) else {'run': [], 'kept': []}) }}

- name: Write down what the kernel ran before BBR
  copy:
    content: |
      # Managed by ansible-role-freesocks (node_tcp_bbr): what the kernel ran
      # before BBR and the interfaces the role gave fq. Put back when
      # node_tcp_bbr is turned off. Not read by sysctl at boot.
      {% for k, v in _sysctl_prev | dictsort %}
      {{ k }} = {{ v }}
      {% endfor %}
      {% for d in (_sysctl_prev_devs + (_sysctl_qdisc_plan.run | map(attribute='dev') | list)) | unique | sort %}
      # qdisc: {{ d }}
      {% endfor %}
    dest: "{{ _sysctl_previous_file }}"
    mode: '0644'
  become: "{{ _fcp_become | default(true) }}"
  when: _sysctl_bbr | bool

- name: Write the role's sysctl drop-in
  copy:
    content: |
      # Managed by ansible-role-freesocks: kernel settings for the node
      # (node_quic_buffers, node_tcp_bbr). Edits here are overwritten.
      {% for k, v in _sysctl_settings | dictsort %}
      {{ k }} = {{ v }}
      {% endfor %}
    dest: "{{ _sysctl_file }}"
    mode: '0644'
  register: _sysctl_written
  become: "{{ _fcp_become | default(true) }}"
  when: _sysctl_settings | length > 0

- name: Remove the role's sysctl drop-in (nothing to set)
  file:
    path: "{{ _sysctl_file }}"
    state: absent
  become: "{{ _fcp_become | default(true) }}"
  when: _sysctl_settings | length == 0

# What the kernel runs, not only what the file says: a run that wrote the file
# and stopped before applying it still applies on the next run.
- name: Read the kernel's settings
  command: sysctl -n {{ _sysctl_settings.keys() | sort | join(' ') }}
  register: _sysctl_now
  changed_when: false
  failed_when: false
  become: "{{ _fcp_become | default(true) }}"
  when: _sysctl_settings | length > 0

- name: Apply the role's sysctl drop-in
  command: sysctl -p {{ _sysctl_file }}
  register: _sysctl_applied
  become: "{{ _fcp_become | default(true) }}"
  when:
    - _sysctl_settings | length > 0
    - (_sysctl_written is changed)
      or (_sysctl_now.stdout_lines | default([]) | map('trim') | list)
         != (_sysctl_settings | dictsort | map('last') | map('string') | list)

# BBR turned off: the kernel gets back what the record says it ran before
# (default_qdisc first, so an interface handed back to the kernel takes it).
- name: Put back what the kernel ran before BBR
  command: sysctl -p {{ _sysctl_previous_file }}
  register: _sysctl_restored
  become: "{{ _fcp_become | default(true) }}"
  when:
    - not (node_tcp_bbr | bool)
    - _sysctl_prev | length == 2

# After the kernel's default is set either way: fq with BBR on, the earlier
# default with BBR off. Queued packets on the interface are dropped once.
- name: Change the qdisc of the interfaces that are up
  command:
    argv: "{{ ['tc'] + item.argv }}"
  loop: "{{ _sysctl_qdisc_plan.run }}"
  loop_control:
    label: "{{ item.dev }}"
  register: _sysctl_qdisc_changed
  become: "{{ _fcp_become | default(true) }}"

- name: Forget the record (BBR is off and the earlier values are back)
  file:
    path: "{{ _sysctl_previous_file }}"
    state: absent
  become: "{{ _fcp_become | default(true) }}"
  when: not (node_tcp_bbr | bool)

- name: Say what the kernel runs with
  debug:
    msg: >-
      Kernel settings for {{ node_name }}:
      {{ _sysctl_settings | dictsort | map('join', ' = ') | join(', ') if _sysctl_settings else 'none of the role' }}.
      {% if _sysctl_restored is changed %}BBR off, put back:
      {{ _sysctl_prev | dictsort | map('join', ' = ') | join(', ') }}.{% endif %}
      {% if _sysctl_qdisc_plan.run %}qdisc changed on:
      {{ _sysctl_qdisc_plan.run | map(attribute='dev') | join(', ') }}.{% endif %}
      {% if _sysctl_qdisc_plan.kept %}qdisc left as it is on:
      {{ _sysctl_qdisc_plan.kept | join(', ') }}.{% endif %}
  when: >-
    (_sysctl_written is changed) or (_sysctl_applied is changed)
    or (_sysctl_restored is changed) or (_sysctl_qdisc_plan.run | length > 0)
    or (_sysctl_qdisc_plan.kept | length > 0)
