---
# tasks/setup/caddy.yml - Caddy in front of a front node's loopback WebSocket
# inbound: TLS on the external port FCP declared (remnawave_caddy_listen_port
# when it declared none) for the origin hostname FCP served (HTTP-01 on port
# 80, which must be free), the routes FCP declared proxied to their loopback
# ports, everything else a decoy site.

- name: Set the routes and the external port FCP declared
  set_fact:
    caddy_routes: "{{ _fcp_bootstrap.ingress.routes | default([]) }}"
    caddy_listen_port: "{{ _fcp_bootstrap.ingress.externalPort | default(remnawave_caddy_listen_port) | int }}"

- name: Assert FCP declared at least one route
  assert:
    that:
      - caddy_routes | length > 0
    fail_msg: "FCP served an ingress without routes for this node"

- name: Assert the ACME registration address is set
  assert:
    that:
      - remnawave_caddy_email | length > 0
    fail_msg: "remnawave_caddy_email is required on a node that runs Caddy (ACME registration)"

# === Install Caddy from the official apt repo ===
- name: Install Caddy apt prerequisites
  apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
    state: present
  become: yes

- name: Ensure /etc/apt/keyrings exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Download the Caddy apt signing key
  get_url:
    url: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"
    dest: /etc/apt/keyrings/caddy-stable-archive-keyring.asc
    mode: '0644'
    force: no
  become: yes

- name: Add the Caddy apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/caddy-stable-archive-keyring.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    filename: caddy-stable
    state: present
    update_cache: yes
  become: yes

- name: Install Caddy
  apt:
    name: caddy
    state: present
  become: yes

- name: Set up the decoy site
  include_tasks: decoy.yml

- name: Render the Caddyfile
  template:
    src: remnanode-caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: '0644'
    validate: "caddy validate --config %s --adapter caddyfile"
  become: yes
  notify: reload caddy

- name: Ensure Caddy is enabled and running
  systemd:
    name: caddy
    state: started
    enabled: yes
  become: yes

- name: Flush handlers (apply the Caddyfile now)
  meta: flush_handlers

- name: Wait for Caddy to bind the listen port
  wait_for:
    host: 127.0.0.1
    port: "{{ caddy_listen_port }}"
    timeout: 30
    delay: 2

- name: Check which process owns the listen port
  shell: "ss -ltnHp 'sport = :{{ caddy_listen_port }}'"
  register: caddy_port_owner
  changed_when: false
  failed_when: false
  become: yes

- name: Assert Caddy (not Xray) owns the public TLS port
  assert:
    that:
      - "'caddy' in caddy_port_owner.stdout"
    fail_msg: >-
      Port {{ caddy_listen_port }} is not owned by Caddy
      (listeners: {{ caddy_port_owner.stdout | trim | default('none') }}).
      The panel's inbound for this node must listen on its loopback port
      ({{ caddy_routes | map(attribute='port') | join(', ') }}), which FCP's
      profile does; look at the profile in Admin -> Servers.
  when: caddy_port_owner.stdout | default('') | length > 0

# Whether a certificate for THIS origin hostname is there yet is reported to
# FCP with the applied revision (an older hostname's certificate does not
# count); FCP checks the served certificate from outside either way.
- name: Look for the origin hostname's certificate
  find:
    paths: /var/lib/caddy/.local/share/caddy/certificates
    patterns: "{{ origin_hostname }}.crt"
    recurse: yes
  register: _caddy_certs
  failed_when: false
  become: yes

- name: Note certificate readiness
  set_fact:
    _caddy_cert_ready: "{{ (_caddy_certs.files | default([])) | selectattr('path', 'search', '/' ~ (origin_hostname | regex_escape) ~ '/') | list | length > 0 }}"
