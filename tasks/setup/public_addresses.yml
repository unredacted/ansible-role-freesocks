---
# tasks/setup/public_addresses.yml - what the role OBSERVES and reports:
# the machine's public IPv4 (and IPv6 when it is to be published). FCP
# decides what an edge dials and what an origin record says; the role only
# reports what it sees.

- name: Gather network facts
  setup:
    gather_subset:
      - '!all'
      - '!min'
      - network
  when: ansible_default_ipv4 is not defined

- name: Detect the public addresses
  set_fact:
    _public_v4: "{{ (ansible_default_ipv4 | default({})).address | default('') }}"
    _public_v6: >-
      {{ ((ansible_default_ipv6 | default({})).address | default(''))
         if (node_publish_ipv6 | bool) else '' }}

- name: Use the configured origin address for a relay node
  set_fact:
    _public_v4: "{{ node_origin_address }}"
  when:
    - node_purpose == 'relay'
    - node_origin_address | length > 0

- name: Assert a public IPv4 was found
  assert:
    that:
      - _public_v4 | length > 0
      - _public_v4 is match('^(\d{1,3}\.){3}\d{1,3}$')
    fail_msg: >-
      No public IPv4 was detected on this machine. Set node_origin_address
      (relay) or make sure the default route carries a public address.
