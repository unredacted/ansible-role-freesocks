---
# tasks/setup/public_addresses.yml - what the role OBSERVES and reports:
# the machine's public IPv4 (and IPv6 when it is to be published). FCP
# decides what an edge dials and what an origin record says; the role only
# reports what it sees.

- name: Gather network facts
  setup:
    gather_subset:
      - '!all'
      - '!min'
      - network
  when: ansible_default_ipv4 is not defined

# The default route's address is what a machine with a public interface
# carries. Behind NAT (a cloud private interface, a relay on a tailnet) it is
# not reachable from outside: node_public_address then says what is, for
# every mode (a direct node's member address, a WebSocket node's origin
# record, what an edge dials for a fronted node).
- name: Detect the public addresses
  set_fact:
    _public_v4: >-
      {{ node_public_address if (node_public_address | length > 0)
         else ((ansible_default_ipv4 | default({})).address | default('')) }}
    _public_v6: >-
      {{ ((ansible_default_ipv6 | default({})).address | default(''))
         if (node_publish_ipv6 | bool) else '' }}

- name: Assert a public IPv4 was found
  assert:
    that:
      - _public_v4 | length > 0
      - _public_v4 is match('^(\d{1,3}\.){3}\d{1,3}$')
      - not (_public_v4 is match('^(10\.|127\.|169\.254\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.)'))
    fail_msg: >-
      No public IPv4 was found on this machine (detected '{{ _public_v4 }}').
      Set node_public_address to the address members, edges or the origin
      record should use, or make sure the default route carries a public one.
