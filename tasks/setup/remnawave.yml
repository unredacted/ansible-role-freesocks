---
# tasks/setup/remnawave.yml - the remnanode container. The compose file carries
# the panel's node secret FCP served (register_node.yml); it is rendered
# no_log with restrictive permissions and never printed.

- name: Create the install directory
  file:
    path: "{{ remnawave_node_install_dir }}"
    state: directory
    mode: '0755'
  become: yes

- name: Create the log directory
  file:
    path: "{{ remnawave_log_dir }}"
    state: directory
    mode: '0755'
  become: yes

- name: Render docker-compose.yml
  template:
    src: remnanode-docker-compose.yml.j2
    dest: "{{ remnawave_node_install_dir }}/docker-compose.yml"
    mode: '0640'
  vars:
    remnawave_node_port: "{{ _fcp_bootstrap.nodePort | int }}"
  become: yes
  register: compose_template
  no_log: true # the rendered file carries the panel-wide node secret

- name: Render the logrotate config
  template:
    src: remnanode-logrotate.j2
    dest: /etc/logrotate.d/remnanode
    mode: '0644'
  become: yes

- name: Pull the node image
  community.docker.docker_image:
    name: "{{ remnawave_node_image }}"
    source: pull
    force_source: "{{ (force_reinstall_remnawave | bool) or (operation_mode == 'update') }}"
  become: yes

- name: Bring up the node container
  community.docker.docker_compose_v2:
    project_src: "{{ remnawave_node_install_dir }}"
    state: present
    recreate: "{{ 'always' if (compose_template.changed or (force_reinstall_remnawave | bool) or (operation_mode == 'update')) else 'auto' }}"
  become: yes

- name: Wait for the node port to open
  wait_for:
    host: 127.0.0.1
    port: "{{ _fcp_bootstrap.nodePort | int }}"
    timeout: 60
