---
# tasks/setup/remnawave.yml - the remnanode container. The compose file carries
# the panel's node secret: the one the node already has while it stays good,
# else the one FCP served (register_node.yml, remnanode_compose.yml). It is
# rendered no_log with restrictive permissions and never printed.

- name: Create the install directory
  file:
    path: "{{ remnawave_node_install_dir }}"
    state: directory
    mode: '0755'
  become: yes

- name: Create the log directory
  file:
    path: "{{ remnawave_log_dir }}"
    state: directory
    mode: '0755'
  become: yes

# Keeps the node's panel secret across runs, so a repeat run leaves the file,
# and so the container, alone (remnanode_compose.yml).
- name: Render docker-compose.yml
  include_tasks: setup/remnanode_compose.yml

- name: Render the logrotate config
  template:
    src: remnanode-logrotate.j2
    dest: /etc/logrotate.d/remnanode
    mode: '0644'
  become: yes

# Through a mirror, logged in, retried while Docker Hub rate-limits, and over
# IPv4 as a last resort (image_pull.yml).
- name: Pull the node image
  include_tasks: setup/image_pull.yml

- name: Bring up the node container
  community.docker.docker_compose_v2:
    project_src: "{{ remnawave_node_install_dir }}"
    state: present
    recreate: "{{ 'always' if (compose_template.changed or (force_reinstall_remnawave | bool) or (operation_mode == 'update')) else 'auto' }}"
  become: yes

- name: Wait for the node port to open
  wait_for:
    host: 127.0.0.1
    port: "{{ _fcp_bootstrap.nodePort | int }}"
    timeout: 60
