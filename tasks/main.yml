---
# tasks/main.yml - ansible-role-freesocks v2
#
# The role bootstraps the MACHINE and reports; FCP owns the panel and the
# release to members (contract v2, FCP docs/servers.md "Node lifecycle"):
#
#   deploy   validate -> base packages, Docker -> resolve addresses ->
#            enroll / report observations (PUT) -> fetch the machine
#            configuration + node secret (POST bootstrap) ->
#            [front] wait for the origin name to resolve, Caddy + decoy ->
#            render compose, start the node -> report applied ->
#            [optional] wait for FCP's machine_ready
#   update   re-pull the image, recreate, re-report applied
#   wipe     ask FCP to retire the node; FCP tears down what it made and
#            answers ready_to_wipe; the machine is cleaned up; FCP told (wiped)
#
# Nothing here ever calls the panel. Every FCP call fails the play closed:
# an FCP that cannot be reached, or that refuses, stops the run with its code.

- name: Validate operation_mode
  assert:
    that:
      - operation_mode in ['deploy', 'update', 'wipe']
    fail_msg: "operation_mode must be one of: deploy, update, wipe (got '{{ operation_mode }}')"

- name: Validate FCP settings
  assert:
    that:
      - fcp_api_url | length > 0
      - fcp_api_token | length > 0
      - fcp_remnawave_panel_slug | length > 0
    fail_msg: "fcp_api_url, fcp_api_token (vault) and fcp_remnawave_panel_slug are required"

- name: Refuse an unencrypted FCP token in the inventory
  assert:
    that:
      - "'$ANSIBLE_VAULT;' not in (fcp_api_token | string)"
    fail_msg: "fcp_api_token is still a raw vault blob: pass --ask-vault-pass or a vault id"

- name: Validate front-node settings
  assert:
    that:
      - remnawave_caddy_email | length > 0
    fail_msg: "remnawave_caddy_email is required on a front node (ACME registration)"
  when: node_purpose == 'front'

# --- the node's identity: name and purpose, taken once, persisted on the machine ---
#
# Both are persisted BEFORE the first FCP call, so a run that stops halfway
# (a lost bootstrap answer, an origin name that never resolves) resumes
# against the same node instead of enrolling a second one. A later run may
# omit both: they are read back. A purpose is immutable at FCP; a different
# one passed later is refused here rather than sent.

- name: Read the persisted node name and purpose
  slurp:
    src: "{{ remnawave_node_install_dir }}/{{ item }}"
  loop: [".node_name", ".node_purpose"]
  register: _identity_files
  failed_when: false
  become: yes

- name: Use the persisted node name
  set_fact:
    node_name: "{{ _identity_files.results[0].content | b64decode | trim }}"
  when:
    - node_name | trim | length == 0
    - _identity_files.results[0].content is defined

- name: Use the persisted purpose
  set_fact:
    _persisted_purpose: "{{ _identity_files.results[1].content | b64decode | trim }}"
  when: _identity_files.results[1].content is defined

- name: Refuse a purpose that differs from the persisted one
  assert:
    that:
      - node_purpose | trim | length == 0 or node_purpose | trim == _persisted_purpose
    fail_msg: >-
      This machine was enrolled as a {{ _persisted_purpose }} node; a node keeps its
      purpose (got '{{ node_purpose }}'). An admin changes it from Servers.
  when: _persisted_purpose is defined

- name: Take the persisted purpose
  set_fact:
    node_purpose: "{{ _persisted_purpose }}"
  when:
    - node_purpose | trim | length == 0
    - _persisted_purpose is defined

- name: Validate node_purpose
  assert:
    that:
      - node_purpose | trim in ['direct', 'front', 'relay']
    fail_msg: >-
      node_purpose must be one of: direct, front, relay (got '{{ node_purpose }}').
      A machine that was deployed before carries it in
      {{ remnawave_node_install_dir }}/.node_purpose.
  when: operation_mode != 'wipe'

- name: Normalize the given node name
  set_fact:
    node_name: "{{ node_name | trim }}"
    node_purpose: "{{ node_purpose | trim }}"

- name: Refuse to invent a name for a machine that was never deployed
  assert:
    that:
      - node_name | length > 0
    fail_msg: >-
      No node name was given and none is persisted on this machine
      ({{ remnawave_node_install_dir }}/.node_name): nothing to {{ operation_mode }}.
  when: operation_mode != 'deploy'

- name: Generate a node name
  include_tasks: setup/node_name.yml
  when: node_name | length == 0

- name: Validate the node name
  assert:
    that:
      - node_name is match('^[A-Za-z0-9 ._-]{3,30}$')
      - node_name == node_name | trim
    fail_msg: "node_name must be 3 to 30 plain characters (got '{{ node_name }}')"

- name: Persist the node's identity before the first FCP call
  when: operation_mode != 'wipe'
  become: yes
  block:
    - name: Create the install directory
      file:
        path: "{{ remnawave_node_install_dir }}"
        state: directory
        mode: '0755'

    - name: Persist the node name and purpose
      copy:
        content: "{{ item.value }}\n"
        dest: "{{ remnawave_node_install_dir }}/{{ item.file }}"
        mode: '0640'
      loop:
        - { file: ".node_name", value: "{{ node_name }}" }
        - { file: ".node_purpose", value: "{{ node_purpose }}" }
      loop_control:
        label: "{{ item.file }}"

# --- wipe --------------------------------------------------------------------

- name: Retire the node
  include_tasks: providers/fcp/wipe.yml
  when: operation_mode == 'wipe'

# --- deploy / update -----------------------------------------------------------

- name: Bootstrap the machine
  when: operation_mode in ['deploy', 'update']
  block:
    - name: Install base packages
      include_tasks: setup/install.yml

    - name: Install Docker
      include_tasks: setup/docker.yml

    - name: Detect the public addresses
      include_tasks: setup/public_addresses.yml

    - name: Resolve the management address
      include_tasks: providers/remnawave/resolve_node_address.yml
      vars:
        remnawave_node_address: "{{ node_management_address }}"
        remnawave_node_address_fallback: "{{ _public_v4 }}"
        remnawave_node_address_interface: "{{ node_address_interface }}"
        remnawave_node_address_family: "{{ node_address_family }}"
        remnawave_node_port: 2222

    - name: Enroll with FCP and fetch the machine configuration
      include_tasks: providers/fcp/register_node.yml

    - name: Set up Caddy and the decoy site (front nodes)
      include_tasks: setup/caddy.yml
      when: node_purpose == 'front'

    - name: Start the node
      include_tasks: setup/remnawave.yml

    - name: Report the applied revision
      include_tasks: providers/fcp/applied.yml

    - name: Wait for FCP's status gate
      include_tasks: providers/fcp/status_gate.yml
      vars:
        _fcp_gate_slug: "{{ fcp_remnawave_panel_slug }}"
      when: fcp_status_gate | bool

- name: Summary
  debug:
    msg: >-
      {{ node_name }} ({{ node_purpose }}): {{ operation_mode }} done.
      {% if operation_mode != 'wipe' %}FCP stage: {{ _fcp_view.json.stage | default('unknown') }}.
      Release it to members from Admin -> Servers.{% endif %}
