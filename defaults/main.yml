---
# defaults/main.yml
#
# ansible-role-freesocks v2: the role bootstraps the MACHINE of a FreeSocks
# node and reports to the FreeSocks Control Plane (FCP). FCP owns everything
# on the panel (the profile, inbounds, squads, Hosts), the origin DNS record
# of a front node, the fronting and the release to members. The role never
# talks to the panel: the panel's node secret comes from FCP with the machine
# configuration (contract v2, FCP docs/servers.md "Node lifecycle").

# --- operation ---------------------------------------------------------------
# deploy  bootstrap the machine and enroll (idempotent; also how a machine
#         change FCP made is applied: run it again)
# update  refresh the node image and re-report
# wipe    retire the node: FCP tears down what it made, then the machine is
#         cleaned up and FCP told so
operation_mode: ""

# --- FCP ---------------------------------------------------------------------
fcp_api_url: ""
# An `fsv1_` token for the node's own routes (FCP docs/servers.md "Node
# registration (contract v2)"): either the fleet token (admin:servers:write,
# which reads the node's view too), or an admin:edges:register token minted
# with a registration boundary (this backend server and, better, this node
# name). admin:servers:manage is no role token: FCP bounds it like the register
# scope, so on its own it never reaches the node secret. Vault it.
fcp_api_token: ""
# The panel's slug in FCP (Admin -> Backend servers).
fcp_remnawave_panel_slug: "remnawave-primary"
# The contract version this role speaks; FCP refuses an older one.
fcp_role_contract_version: 2
# Polling the node's own view (GET …/nodes/by-name/{name}) between steps.
fcp_registration_retries: 60
fcp_registration_delay: 5
# Wait for FCP to verify the machine after the applied report (machine_ready).
fcp_wait_machine_ready: true
# Optional, at the end of a run: wait until the node's own view is healthy
# (machine_ready or later, the applied revision current, nothing blocked or
# retiring, no port change waiting on this node), then until the backend row is
# healthy in GET /api/v1/admin/status (that part needs admin:status:read too).
fcp_status_gate: false
fcp_status_gate_retries: 45
fcp_status_gate_delay: 20

# --- the firewall (FCP docs/servers.md "Firewall acknowledgement") -------------
# FCP moves a transport to another port only once every node serving it says
# its firewall lets the new port in. On every deploy/update run the role lets
# in each port FCP lists for this node (TCP, from anywhere) before it reports,
# and tells FCP which ports are open.
#
# Where the role keeps its rules. It owns ONE object there and never touches
# anything else: never a rule of yours, never a default policy, never enabling
# or reloading a firewall that is off.
#   auto       firewalld if it runs, else ufw if it is active, else nftables if
#              nftables.service is active, else none
#   ufw        an application profile `freesocks-fcp` and the one rule allowing it
#   firewalld  a service `freesocks-fcp` in fcp_firewall_firewalld_zone (a change
#              to it reloads firewalld)
#   nftables   a set `freesocks_fcp` in fcp_firewall_nftables_file, which YOUR
#              ruleset includes inside the table of its input chain and lets in:
#                include "/etc/nftables.d/freesocks-fcp.nft"
#                tcp dport @freesocks_fcp accept
#   none       the role writes no rule
fcp_firewall_backend: auto
# What you vouch is open that the role did not open itself: `true` (every port
# FCP lists), a list of ports, or `false`. With `none` (or nothing found by
# `auto`) the role reports only these: a firewall it cannot see, such as a
# provider's, may still drop the rest, so a port change waits on this node
# until you say so.
fcp_firewall_assume_open: false
# A firewall in front of the machine that the role cannot reach (a cloud
# provider's security group) filters it too. The role still opens its own
# rules, but reports only what fcp_firewall_assume_open vouches for.
fcp_firewall_provider_filter: false
# Never closed on the role's account, even once FCP stops listing them: SSH
# (22 and ansible_port) and the node API port are always kept; add more here.
fcp_firewall_protected_ports: []
fcp_firewall_firewalld_zone: ""          # empty = the default zone
fcp_firewall_nftables_table: "inet filter"
fcp_firewall_nftables_file: "/etc/nftables.d/freesocks-fcp.nft"

# --- the node ------------------------------------------------------------------
# The connection MODE this node serves: one of the modes the backend was set up
# for in FCP (Admin -> Servers), e.g. privacy-reality (REALITY, members connect
# straight to it), freedom-reality (REALITY behind an L4 edge), freedom-xhttp
# (XHTTP under REALITY behind an L4 edge), freedom-ws (WebSocket behind Caddy,
# fronted by an L7 edge). What the machine runs follows from the mode: FCP's
# bootstrap answer says whether Caddy and which routes are wanted.
# Taken at the first deploy and persisted on the machine (.node_mode) once FCP
# has accepted it; a later run may omit it. A node keeps its mode (FCP refuses
# a change).
node_mode: ""
# A machine deployed before modes existed carries a purpose (.node_purpose)
# instead. This is the mode each of those purposes becomes, so such a node stays
# deployable; the defaults are the modes a backend is set up for out of the box.
# Pass -e node_mode=... when the backend names its modes otherwise.
fcp_legacy_purpose_modes:
  direct: privacy-reality
  relay: freedom-reality
  front: freedom-ws
# The node's name on the panel and in FCP. Empty = the inventory host name at
# the first deploy, which must then be 3 to 30 lowercase letters and digits with
# single hyphens between them (a DNS label): any other host name stops the run
# and asks for -e node_name=..., the role never rewrites or invents one.
# Persisted on the machine (.node_name) BEFORE the first FCP call, so a run that
# stops halfway resumes against the same node; later runs use the persisted
# name (or the one FCP renamed the node to).
node_name: ""
# The machine's own name, sent at enrollment so FCP shows operators which
# machine a node is (Admin -> Servers, next to the node; the Nodes filter
# matches it). Operator-only: members only ever see node_name. Empty = not sent.
node_machine_name: "{{ inventory_hostname }}"
# The DNS label of a managed origin name (front nodes). Empty = derived from the name.
node_label: ""
# The country is FCP's (the node's Settings in Admin -> Servers), not reported here.
# The MANAGEMENT address the panel dials (port 2222 by default): an interface's
# address (e.g. tailscale0 on a relay) or the machine's public name.
node_address_interface: ""
node_address_family: "ipv4"
node_management_address: ""
# The machine's PUBLIC IPv4 as seen from the Internet: what members dial on a
# direct node, what the origin record says on a front node, what an edge dials
# on a relay. Empty = the default route's address, which behind NAT (a cloud
# private interface, a tailnet) is not it: set this then.
node_public_address: ""
# Publish the machine's IPv6 in the origin record (front nodes). Only when it is
# globally reachable.
node_publish_ipv6: false
# A front node's origin hostname when FCP does not manage the zone (explicit DNS).
node_origin_hostname: ""

# --- the remnanode container ------------------------------------------------
remnawave_node_image: "remnawave/node:3.4.2"
remnawave_node_install_dir: "/opt/remnanode"
remnawave_log_dir: "/var/log/remnanode"
# The 3.x node's nftables plugins log client IPs by default: kept OFF (no-log posture).
remnawave_node_nftables_logging: false
force_reinstall_remnawave: false
remnawave_docker_apt_suite: ""

# --- pulling the node image ----------------------------------------------------
# Docker Hub limits anonymous pulls per IPv4 address and per IPv6 /64, and a
# node often shares its /64 with its neighbours: the pull can be refused (429
# toomanyrequests) over IPv6 while the machine's own IPv4 still has plenty. An
# image already on the machine is not pulled again (update and
# force_reinstall_remnawave do pull it). Otherwise the role tries, in order:
# the mirror (when set), the registry (logged in when Docker Hub credentials
# are set) with a wait before each retry while it answers 429, and, as a last
# resort, Docker Hub over IPv4.
#
# A Docker Hub account: pulls then count against its own, higher limit, not
# the address's. Its username and an access token (read-only, public
# repositories), both or neither; vault the token. For the pull only, they go
# to a Docker config under /run (tmpfs), which is removed afterwards; root's
# own Docker config is never touched.
remnawave_docker_hub_username: ""
remnawave_docker_hub_token: ""
# A pull-through cache of Docker Hub, as an image prefix: host[:port][/path],
# e.g. "mirror.example.org" or "registry.example.org/dockerhub". An image on
# Docker Hub is pulled through it first (anonymously, or with root's own
# `docker login` for it) and tagged under its own name, so compose finds it.
# When the mirror fails, Docker Hub is asked instead.
remnawave_docker_hub_mirror: ""
# Seconds to wait before each retry while the registry answers 429, one retry
# per entry. Any other failure stops the run at once.
remnawave_node_image_pull_backoff: [10, 30, 60]
# The last resort, when Docker Hub still answers 429 after the retries: one
# more pull with these names pinned to their IPv4 addresses in /etc/hosts. The
# pin is removed right after, whether the pull worked or not; a run stopped in
# between leaves it to the next run (or wipe) to remove.
remnawave_docker_hub_ipv4_fallback: true
remnawave_docker_hub_ipv4_names:
  - registry-1.docker.io
  - auth.docker.io

# --- Front server (front nodes) ---------------------------------------------------
# Which server terminates TLS in front of a front node's loopback transport and
# serves the decoy: `caddy` or `nginx` (from nginx.org, with its ACME module).
# Switching a node stops the other one (its open sessions drop) and takes a
# new certificate for the origin hostname. Caddy until nginx has run on a
# canary node; then flip the default.
remnawave_front_server: caddy

# --- Caddy (front nodes) ---------------------------------------------------------
# Where Caddy is not the front server (no ingress, or nginx in front): remove it
# entirely (package, user, data and certificates, logs, configuration, its apt
# repository). Off: stop and disable it only, keeping the package and its home.
remnawave_caddy_purge: true
# remnawave_caddy_email, _listen_port and _strip_request_headers apply to nginx
# too (ACME registration, the port when FCP declared none, the headers removed).
remnawave_caddy_email: ""
remnawave_caddy_listen_port: 443
remnawave_decoy_root: "/var/www/decoy"
# The decoy (tasks/setup/decoy.yml). Empty: the front server's own stock page
# from its package. A path on the controller: a decoy kit kept in private
# inventory (its templates here, its `decoy_kit` filter in the playbook's
# filter_plugins). Never ship a kit in this public repository.
remnawave_decoy_kit: ""
# Empty: nginx's /usr/share/nginx/html/index.html or Caddy's
# /usr/share/caddy/index.html, by remnawave_front_server.
remnawave_decoy_stock_page: ""
# Members' addresses never reach Xray: Caddy removes these request headers
# (`header_up -<name>`, WebSocket upgrades included) on every route before it
# proxies to the loopback inbound. Every header an edge or a client may use to
# carry the member's address; an edge strips what it can, but some add one
# their own configuration cannot remove, so Caddy is the last place to drop
# it. X-Forwarded-For also removes the one Caddy sets itself (the edge
# server's address); the Caddyfile sets no trusted_proxies. One name per line.
remnawave_caddy_strip_request_headers:
  - X-Forwarded-For
  - Forwarded
  - X-Forwarded
  - Forwarded-For
  - X-Real-IP
  - X-Client-IP
  - Client-IP
  - X-Cluster-Client-IP
  - True-Client-IP
  - Fastly-Client-IP
  - Fastly-WAF-Client-IP
  - Fastly-Temp-XFF
  - CF-Connecting-IP
  - CF-Connecting-IPv6
  - CF-Pseudo-IPv4
  - CloudFront-Viewer-Address
  - X-Azure-ClientIP
  - X-Azure-SocketIP

# --- nginx (front nodes, remnawave_front_server: nginx) --------------------------
# The role's own configuration file; the package's /etc/nginx/nginx.conf is
# left as shipped (an edited conffile holds unattended upgrades back).
remnawave_nginx_conf: /etc/nginx/freesocks/nginx.conf
# nginx.org's signing keys, as published on https://nginx.org/en/linux_packages.html.
# Every primary key in the downloaded keyring must be one of these.
remnawave_nginx_signing_key_fingerprints:
  - 573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62
  - 8540A6F18833A80E9C1653A42FD21310B49F6B46
  - 9E9BE90EACBCDE69FE9B204CBCDCD8A38D88A2B3
remnawave_nginx_acme_directory: https://acme-v02.api.letsencrypt.org/directory
# The ACME module's account key, certificates and keys (0700, the nginx user).
remnawave_nginx_acme_state_dir: /var/lib/nginx-acme/freesocks
# Empty: the nameservers in the host's /etc/resolv.conf.
remnawave_nginx_resolvers: []
# How many connections nginx can hold in all (each session holds two: the
# edge's and the loopback one to Xray). Empty: 32 per MiB of the machine's RAM
# (about 1M on 32 GiB, half a million sessions), so more RAM raises it on the
# next run. Each worker (one per vCPU) gets its share plus a quarter, at least
# 16384; nginx sets each slot up at start, about 0.5 KiB a slot.
remnawave_nginx_max_connections: ""
# Loopback addresses nginx connects to Xray from (127.0.0.1 .. 127.0.0.N): each
# adds a full ephemeral port range of sessions per inbound.
remnawave_nginx_loopback_sources: 64
# The listen queue of each listener (the kernel caps it at net.core.somaxconn,
# which remnawave_front_kernel_tuning raises to match).
remnawave_nginx_backlog: 65535
# How long a proxied stream may stay silent before nginx closes it. Sessions
# through an edge often idle for minutes between packets.
remnawave_nginx_stream_timeout: 1h
# A reload or a package upgrade starts new workers; the old ones keep their
# open sessions until they end or this passes.
remnawave_nginx_worker_shutdown_timeout: 10m
# Below crit, nginx writes the client's address into its error lines: raise it
# only to debug, and lower it again.
remnawave_nginx_error_log_level: crit
# How many times (5 s apart) a run looks for the origin certificate being
# served before it reports certificateReady false to FCP.
remnawave_nginx_certificate_wait_tries: 12

# --- Kernel limits (front nodes running nginx; tasks/setup/front_sysctl.yml) ----
# One drop-in of the role's, remnawave_front_sysctl_file, that only ever RAISES:
# a larger value the machine already has is kept. The listen and device
# backlogs, TIME_WAIT and orphan sockets, the kernel's TCP memory (a share of
# RAM, so more RAM raises it) and the connection-tracking table.
remnawave_front_kernel_tuning: true
remnawave_front_sysctl_file: /etc/sysctl.d/61-freesocks-front.conf
# Shares of RAM for net.ipv4.tcp_mem (low, pressure, high), in percent.
remnawave_front_tcp_mem_percent: [12.5, 18.75, 25]
# Connection-tracking entries per MiB of RAM (about 2M on 32 GiB).
remnawave_front_conntrack_per_mb: 64
