---
# tests/test_caddyfile_render.yml
#
# Render test for templates/remnanode-caddyfile.j2 from a bootstrap answer:
# the origin hostname site plus the catch-all, `fallback_sni`, one handle per
# route to its loopback port, the decoy fallthrough, no handle_path. Every
# route's reverse_proxy removes each client-address header of the role's
# default list (which holds at least the ones below), and nothing trusts an
# upstream proxy. Runs `caddy validate` and `caddy adapt` when the binary is
# present.
#
# Run: ansible-playbook tests/test_caddyfile_render.yml
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    remnawave_caddy_email: "admin@example.com"
    caddy_listen_port: 443
    remnawave_decoy_root: "/var/www/decoy"
    origin_hostname: "bright-harbor-lane.origin.example"
    caddy_routes:
      - { path: "/ws", port: 8443 }
      - { path: "/ws2", port: 8446 }
    # The role's own default, so the test covers what a node renders.
    remnawave_caddy_strip_request_headers: >-
      {{ (lookup('file', playbook_dir ~ '/../defaults/main.yml') | from_yaml).remnawave_caddy_strip_request_headers }}
    _must_strip:
      - Fastly-WAF-Client-IP
      - Fastly-Client-IP
      - Fastly-Temp-XFF
      - True-Client-IP
      - X-Real-IP
      - Forwarded
      - X-Client-IP
      - Client-IP
      - X-Cluster-Client-IP
      - CF-Connecting-IP
      - CF-Connecting-IPv6
      - X-Forwarded-For
    _nl: "\n"
    _strip_block: >-
      {{ (['{'] + (remnawave_caddy_strip_request_headers | map('regex_replace', '^', '            header_up -') | list)
          + ['        }']) | join(_nl) }}
    _rendered: "{{ playbook_dir }}/.caddyfile.rendered"
  tasks:
    - block:
        - name: Render the Caddyfile
          template:
            src: "{{ playbook_dir }}/../templates/remnanode-caddyfile.j2"
            dest: "{{ _rendered }}"
          changed_when: false

        - name: Read it
          set_fact:
            _caddy: "{{ lookup('file', _rendered) }}"

        - name: Assert the structure
          assert:
            that:
              - "'fallback_sni bright-harbor-lane.origin.example' in _caddy"
              - "'bright-harbor-lane.origin.example:443, https://:443 {' in _caddy"
              - "'@r1 path /ws' in _caddy"
              - "'reverse_proxy 127.0.0.1:8443 ' ~ _strip_block in _caddy"
              - "'@r2 path /ws2' in _caddy"
              - "'reverse_proxy 127.0.0.1:8446 ' ~ _strip_block in _caddy"
              - "'root * /var/www/decoy' in _caddy"
              - "'file_server' in _caddy"
              - "'handle_path' not in _caddy"
            success_msg: "Caddyfile: origin site + catch-all, fallback_sni, routes, decoy."

        - name: Assert members' addresses are removed on every route and nothing trusts an upstream proxy
          assert:
            that:
              - _must_strip | difference(remnawave_caddy_strip_request_headers) | length == 0
              - _caddy | regex_findall('header_up -') | length == (remnawave_caddy_strip_request_headers | length) * (caddy_routes | length)
              - "'header_up -X-Forwarded-Proto' not in _caddy"
              - "'trusted_proxies' not in _caddy"
              - "'client_ip_headers' not in _caddy"
            fail_msg: >-
              Missing from the default list: {{ _must_strip | difference(remnawave_caddy_strip_request_headers) }}
            success_msg: "Caddyfile: {{ remnawave_caddy_strip_request_headers | length }} client-address headers removed per route."

        - name: Is caddy available
          command: which caddy
          register: _which
          changed_when: false
          failed_when: false

        - name: Validate with caddy
          command: caddy validate --config {{ _rendered }} --adapter caddyfile
          changed_when: false
          when: _which.rc == 0

        - name: Adapt with caddy
          command: caddy adapt --config {{ _rendered }} --adapter caddyfile
          register: _adapted
          changed_when: false
          when: _which.rc == 0

        - name: Assert each reverse_proxy handler deletes the headers
          vars:
            _delete_ops: >-
              "headers":{"request":{"delete":{{ remnawave_caddy_strip_request_headers | to_json(separators=[',', ':']) }}}}
          assert:
            that:
              - _adapted.stdout.count('"handler":"reverse_proxy"') == caddy_routes | length
              - _adapted.stdout.count(_delete_ops) == caddy_routes | length
            success_msg: "caddy adapt: every reverse_proxy handler deletes the client-address headers."
          when: _which.rc == 0
      always:
        - name: Clean up
          file:
            path: "{{ _rendered }}"
            state: absent
