---
# tests/test_compose_render.yml
#
# Render test for templates/remnanode-docker-compose.yml.j2: the node port,
# the UNQUOTED secret (compose list-env keeps quotes literally), nftables
# logging pinned off, the log mount.
#
# Run: ansible-playbook tests/test_compose_render.yml
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    remnawave_node_image: "remnawave/node:3.4.1"
    remnawave_node_port: 2222
    remnawave_panel_secret_key: "c2VjcmV0LXBsYWNlaG9sZGVy"
    remnawave_node_nftables_logging: false
    remnawave_log_dir: "/var/log/remnanode"
    _rendered: "{{ playbook_dir }}/.compose.rendered"
  tasks:
    - block:
        - name: Render the compose file
          template:
            src: "{{ playbook_dir }}/../templates/remnanode-docker-compose.yml.j2"
            dest: "{{ _rendered }}"
          changed_when: false

        - name: Read it
          set_fact:
            _compose: "{{ lookup('file', _rendered) }}"

        - name: Assert the structure
          assert:
            that:
              - "'image: remnawave/node:3.4.1' in _compose"
              - "'- NODE_PORT=2222' in _compose"
              - "'- SECRET_KEY=c2VjcmV0LXBsYWNlaG9sZGVy' in _compose"
              - "'SECRET_KEY=\"' not in _compose"
              - "'- NFTABLES_LOGGING=false' in _compose"
              - "'/var/log/remnanode:/var/log/remnanode' in _compose"
              - "'network_mode: host' in _compose"
            success_msg: "compose: port, unquoted secret, nftables logging off, log mount."
      always:
        - name: Clean up
          file:
            path: "{{ _rendered }}"
            state: absent
