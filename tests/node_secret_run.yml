---
# tests/node_secret_run.yml - one run of the role's compose step for
# tests/test_node_secret.yml: FCP serves _serve, then the file is read back.
#   _serve           the secret FCP serves this run
#   _rotate          remnawave_node_rotate_secret (default false)
#   _force           force_reinstall_remnawave (default false)
- name: FCP serves a secret
  set_fact:
    remnawave_panel_secret_key: "{{ _serve }}"
  no_log: true

- name: Run the role's compose step
  include_role:
    name: ansible-role-freesocks
    tasks_from: setup/remnanode_compose.yml
  vars:
    remnawave_node_rotate_secret: "{{ _rotate | default(false) }}"
    force_reinstall_remnawave: "{{ _force | default(false) }}"

- name: Read the file back
  set_fact:
    _run_changed: "{{ compose_template.changed }}"
    _run_choice: "{{ _remnanode_secret_choice }}"
    _on_disk: "{{ lookup('file', _dir ~ '/docker-compose.yml') | fcp_node_secret_on_host }}"
    _left_over: "{{ _remnanode_secret_on_host }}"
  no_log: true
