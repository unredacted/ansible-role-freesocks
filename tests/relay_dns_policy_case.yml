---
- name: Resolve policy from inventory and marker
  include_tasks: ../tasks/providers/remnawave/resolve_relay_dns_policy.yml
  vars:
    remnawave_relay_skip_dns: "{{ policy_case.override }}"
    _relay_dns_marker_text: "{{ policy_case.marker }}"
    _relay_dns_marker_exists: "{{ policy_case.exists }}"
- name: Assert resolved relay DNS policy
  assert:
    that: remnawave_relay_skip_dns_effective == policy_case.want
