---
# tests/test_identity.yml
#
# Offline test of tasks/setup/identity.yml, the node's name and mode:
#   (a) a machine deployed before modes existed (.node_purpose) is taken for the
#       mode that purpose maps to, and its name is read back;
#   (b) an explicit node_mode overrides that mapping (a backend whose modes are
#       named otherwise);
#   (c) a mode that differs from the persisted one is refused;
#   (d) a fresh machine persists its NAME only: the mode is persisted once FCP
#       has accepted it, so a refused mode is corrected by running again;
#   (e) a purpose no mode is mapped to stops the play with what to pass;
#   (f) a node FCP renamed: an inventory that still says a former name resolves
#       to the current one the machine carries; a name it never had does not;
#   (g) a fresh machine with no name given is named after its inventory host,
#       and a later run keeps the name the machine carries (FCP may have
#       renamed it); update with nothing persisted still names nothing;
#   (h) an inventory host name that is not a DNS label (an address, a dotted
#       name, uppercase, too long, localhost) stops the play before anything is
#       persisted and asks for -e node_name, which is then taken as given.
#
# Each case is its own play so the facts of the previous one are cleared. (g)
# and (h) run against in-memory hosts (add_host), since the name comes from
# inventory_hostname.
#
# Run: ansible-playbook tests/test_identity.yml

- name: (a) a purpose left by an earlier release becomes a mode
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _dir: "{{ playbook_dir }}/.identity-a"
    operation_mode: deploy
    remnawave_node_install_dir: "{{ _dir }}"
    _fcp_become: false
    node_name: ""
    node_mode: ""
  tasks:
    - name: This case's inputs
      set_fact:
        node_name: ""
        node_mode: ""

    - block:
        - name: Prepare the machine directory
          file:
            path: "{{ _dir }}"
            state: directory

        - name: A machine with a name and a purpose, no mode
          copy:
            content: "{{ item.value }}\n"
            dest: "{{ _dir }}/{{ item.file }}"
          loop:
            - { file: ".node_name", value: "quiet-falcon-nest" }
            - { file: ".node_purpose", value: "relay" }

        - name: Resolve the identity
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/identity.yml

        - name: Assert the name was read back and the purpose mapped
          assert:
            that:
              - node_name == 'quiet-falcon-nest'
              - node_mode == 'freedom-reality'
              - not (lookup('file', _dir ~ '/.node_mode', errors='ignore') | default('', true) | trim | length > 0)
            success_msg: "relay -> freedom-reality; nothing persisted for the mode yet."
      always:
        - name: Clean up
          file:
            path: "{{ _dir }}"
            state: absent
    - meta: clear_facts

- name: (b) an explicit mode overrides the mapping
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _dir: "{{ playbook_dir }}/.identity-b"
    operation_mode: deploy
    remnawave_node_install_dir: "{{ _dir }}"
    _fcp_become: false
    node_name: ""
    node_mode: "freedom-ws-eu"
  tasks:
    - name: This case's inputs
      set_fact:
        node_name: ""
        node_mode: "freedom-ws-eu"

    - block:
        - name: Prepare the machine directory
          file:
            path: "{{ _dir }}"
            state: directory

        - name: A machine with a name and a purpose, no mode
          copy:
            content: "{{ item.value }}\n"
            dest: "{{ _dir }}/{{ item.file }}"
          loop:
            - { file: ".node_name", value: "bright-harbor-lane" }
            - { file: ".node_purpose", value: "front" }

        - name: Resolve the identity
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/identity.yml

        - name: Assert the given mode won
          assert:
            that:
              - node_mode == 'freedom-ws-eu'
            success_msg: "the mode passed on the command line wins over the mapping."
      always:
        - name: Clean up
          file:
            path: "{{ _dir }}"
            state: absent
    - meta: clear_facts

- name: (c) a node keeps the mode FCP accepted
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _dir: "{{ playbook_dir }}/.identity-c"
    operation_mode: deploy
    remnawave_node_install_dir: "{{ _dir }}"
    _fcp_become: false
    node_name: ""
    node_mode: "freedom-ws"
  tasks:
    - name: This case's inputs
      set_fact:
        node_name: ""
        node_mode: "freedom-ws"

    - block:
        - name: Prepare the machine directory
          file:
            path: "{{ _dir }}"
            state: directory

        - name: A machine enrolled for another mode
          copy:
            content: "{{ item.value }}\n"
            dest: "{{ _dir }}/{{ item.file }}"
          loop:
            - { file: ".node_name", value: "quiet-falcon-nest" }
            - { file: ".node_mode", value: "privacy-reality" }

        - name: A different mode must stop the play
          block:
            - name: Resolve the identity
              include_role:
                name: ansible-role-freesocks
                tasks_from: setup/identity.yml
            - name: (c) Unreached
              assert:
                that: [false]
                fail_msg: "A mode change was accepted on the machine."
          rescue:
            - name: Assert the reason
              assert:
                that:
                  - "'keeps its mode' in (ansible_failed_result.msg | default(''))"
                success_msg: "a persisted mode is not changed from the command line."
      always:
        - name: Clean up
          file:
            path: "{{ _dir }}"
            state: absent
    - meta: clear_facts

- name: (d) a fresh machine persists its name only
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _dir: "{{ playbook_dir }}/.identity-d"
    operation_mode: deploy
    remnawave_node_install_dir: "{{ _dir }}"
    _fcp_become: false
    node_name: "still-water-ridge"
    node_mode: "privacy-reality"
  tasks:
    - name: This case's inputs
      set_fact:
        node_name: "still-water-ridge"
        node_mode: "privacy-reality"

    - block:
        - name: Resolve the identity
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/identity.yml

        - name: Assert the name is on the machine and the mode is not
          assert:
            that:
              - lookup('file', _dir ~ '/.node_name') | trim == 'still-water-ridge'
              - not (lookup('file', _dir ~ '/.node_mode', errors='ignore') | default('', true) | trim | length > 0)
            success_msg: "the name is persisted before FCP is called, the mode is not."
      always:
        - name: Clean up
          file:
            path: "{{ _dir }}"
            state: absent
    - meta: clear_facts

- name: (e) a purpose no mode is mapped to stops the play
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _dir: "{{ playbook_dir }}/.identity-e"
    operation_mode: deploy
    remnawave_node_install_dir: "{{ _dir }}"
    _fcp_become: false
    node_name: ""
    node_mode: ""
  tasks:
    - name: This case's inputs
      set_fact:
        node_name: ""
        node_mode: ""

    - block:
        - name: Prepare the machine directory
          file:
            path: "{{ _dir }}"
            state: directory

        - name: A machine with a purpose nothing maps
          copy:
            content: "{{ item.value }}\n"
            dest: "{{ _dir }}/{{ item.file }}"
          loop:
            - { file: ".node_name", value: "quiet-falcon-nest" }
            - { file: ".node_purpose", value: "gateway" }

        - name: It must stop the play
          block:
            - name: Resolve the identity
              include_role:
                name: ansible-role-freesocks
                tasks_from: setup/identity.yml
            - name: (e) Unreached
              assert:
                that: [false]
                fail_msg: "An unmapped purpose was deployed without a mode."
          rescue:
            - name: Assert the reason names what to pass
              assert:
                that:
                  - "'fcp_legacy_purpose_modes' in (ansible_failed_result.msg | default(''))"
                  - "'node_mode' in (ansible_failed_result.msg | default(''))"
                success_msg: "an unmapped purpose asks for an explicit mode."
      always:
        - name: Clean up
          file:
            path: "{{ _dir }}"
            state: absent
    - meta: clear_facts

- name: (f) an inventory that says a former name follows the rename
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _dir: "{{ playbook_dir }}/.identity-f"
    operation_mode: deploy
    remnawave_node_install_dir: "{{ _dir }}"
    _fcp_become: false
    node_name: ""
    node_mode: ""
  tasks:
    - name: This case's inputs
      set_fact:
        node_name: "quiet-falcon-nest"
        node_mode: ""

    - block:
        - name: Prepare the machine directory
          file:
            path: "{{ _dir }}"
            state: directory

        - name: A machine FCP renamed
          copy:
            content: "{{ item.value }}\n"
            dest: "{{ _dir }}/{{ item.file }}"
          loop:
            - { file: ".node_name", value: "calm-river-delta" }
            - { file: ".node_mode", value: "privacy-reality" }
            - { file: ".node_former_names", value: "quiet-falcon-nest" }

        - name: Resolve the identity
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/identity.yml

        - name: Assert the current name was taken
          assert:
            that:
              - node_name == 'calm-river-delta'
              - lookup('file', _dir ~ '/.node_name') | trim == 'calm-river-delta'
            success_msg: "a former name in the inventory resolves to the current one."

        - name: A name the machine never had
          set_fact:
            node_name: "other-name-here"

        - name: Resolve the identity again
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/identity.yml

        - name: Assert a name the machine never had is not rewritten
          assert:
            that:
              - node_name == 'other-name-here'
            success_msg: "only a former name is followed."
      always:
        - name: Clean up
          file:
            path: "{{ _dir }}"
            state: absent
    - meta: clear_facts

- name: The in-memory hosts (g) and (h) run against
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add the hosts
      add_host:
        name: "{{ item.name }}"
        groups: "{{ item.group }}"
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      loop:
        - { name: "node1-relay-site", group: "usable_names" }
        - { name: "192.0.2.10", group: "unusable_names" }
        - { name: "node1.example.org", group: "unusable_names" }
        - { name: "Node1-Relay-Site", group: "unusable_names" }
        - { name: "node1-relay-site-with-a-long-tail", group: "unusable_names" }
        - { name: "node1--relay-site", group: "unusable_names" }

- name: (g) a fresh machine is named after its inventory host
  hosts: usable_names
  gather_facts: false
  vars:
    _dir: "{{ playbook_dir }}/.identity-g"
    operation_mode: deploy
    remnawave_node_install_dir: "{{ _dir }}"
    _fcp_become: false
    node_name: ""
    node_mode: "privacy-reality"
  tasks:
    - name: This case's inputs
      set_fact:
        operation_mode: deploy
        node_name: ""
        node_mode: "privacy-reality"

    - block:
        - name: Resolve the identity of a machine that carries nothing
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/identity.yml

        - name: Assert the host name was taken and persisted
          assert:
            that:
              - node_name == 'node1-relay-site'
              - lookup('file', _dir ~ '/.node_name') | trim == 'node1-relay-site'
            success_msg: "a new node is named after its inventory host."

        - name: The machine now carries another name (FCP renamed the node)
          copy:
            content: "calm-river-delta\n"
            dest: "{{ _dir }}/.node_name"

        - name: A later run with no name given
          set_fact:
            node_name: ""

        - name: Resolve the identity again
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/identity.yml

        - name: Assert the name the machine carries won over the host name
          assert:
            that:
              - node_name == 'calm-river-delta'
              - lookup('file', _dir ~ '/.node_name') | trim == 'calm-river-delta'
            success_msg: "a persisted name wins over the inventory host name."

        - name: A machine that carries nothing, for an update
          file:
            path: "{{ _dir }}"
            state: absent

        - name: An update with no name given
          set_fact:
            operation_mode: update
            node_name: ""

        - name: It must stop the play
          block:
            - name: Resolve the identity for an update
              include_role:
                name: ansible-role-freesocks
                tasks_from: setup/identity.yml
            - name: (g) Unreached
              assert:
                that: [false]
                fail_msg: "An update named a machine that carries no name."
          rescue:
            - name: Assert the reason
              assert:
                that:
                  - "'nothing to update' in (ansible_failed_result.msg | default(''))"
                success_msg: "only a first deploy takes the inventory host name."
      always:
        - name: Clean up
          file:
            path: "{{ _dir }}"
            state: absent
    - meta: clear_facts

- name: (h) a host name that is not a DNS label is refused, not rewritten
  hosts: unusable_names:localhost
  gather_facts: false
  vars:
    _dir: "{{ playbook_dir }}/.identity-h-{{ inventory_hostname | regex_replace('[^a-zA-Z0-9]', '_') }}"
    operation_mode: deploy
    remnawave_node_install_dir: "{{ _dir }}"
    _fcp_become: false
    node_name: ""
    node_mode: "privacy-reality"
  tasks:
    - name: This case's inputs
      set_fact:
        operation_mode: deploy
        node_name: ""
        node_mode: "privacy-reality"

    - block:
        - name: It must stop the play
          block:
            - name: Resolve the identity of a machine that carries nothing
              include_role:
                name: ansible-role-freesocks
                tasks_from: setup/identity.yml
            - name: (h) Unreached
              assert:
                that: [false]
                fail_msg: "The host name {{ inventory_hostname }} was taken as a node name."
          rescue:
            - name: Assert the reason names the host and what to pass
              assert:
                that:
                  - "inventory_hostname in (ansible_failed_result.msg | default(''))"
                  - "'-e node_name=' in (ansible_failed_result.msg | default(''))"
                  - not (_dir ~ '/.node_name') is exists
                success_msg: "{{ inventory_hostname }} is refused before anything is persisted."

        - name: The operator passes a name
          set_fact:
            node_name: "quiet-falcon-nest"

        - name: Resolve the identity with the given name
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/identity.yml

        - name: Assert the given name was taken
          assert:
            that:
              - node_name == 'quiet-falcon-nest'
              - lookup('file', _dir ~ '/.node_name') | trim == 'quiet-falcon-nest'
            success_msg: "-e node_name works whatever the host is called."
      always:
        - name: Clean up
          file:
            path: "{{ _dir }}"
            state: absent
    - meta: clear_facts
