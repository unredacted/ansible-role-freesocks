---
# tests/test_node_address.yml
#
# Offline test for tasks/providers/remnawave/resolve_node_address.yml — the
# panel-side node MANAGEMENT address resolution (interface IP vs configured
# name). No hosts, no API calls: ansible_facts is shadowed with synthetic
# interface facts via the include's vars — passed as a YAML ALIAS to the literal
# mapping, never as a "{{ _fake_facts }}" template, because the conditional
# `setup` re-gather merges gathered facts into that var and cannot merge into an
# unresolved template string.
#
# Sections:
#   (a1) interface unset  -> remnawave_node_address wins
#   (a2) interface unset + blank address -> the public-address fallback
#   (b1) interface set    -> its IPv4 beats remnawave_node_address
#   (b2) family=ipv6      -> the GLOBAL-scope address, not link-local
#   (b3) dashed/dotted device name -> resolves via the sanitized fact key
#   (b4) re-resolve with no interface -> the fact does not stick from (b1)
#   (b5) BSD/macOS fact shape (ipv4 as a LIST, ipv6 with no scope keys)
#   (c1) unknown interface -> fail (lists what the node does have)
#   (c2) interface without an IPv4 -> fail
#   (c3) family=ipv6 but only link-local -> fail
#   (c4) invalid family -> fail
#   (d1) STRUCTURAL: the enrollment sends the RESOLVED fact and main.yml
#        resolves it (role-tasks-relative include, which is the only form that
#        resolves from inside tasks/) before the enrollment
#   (d2) STRUCTURAL: the network-fact refresh is gated ONLY on the interface
#        selector — never on the device already being in the fact set, which
#        would skip the refresh for a device that is present but unaddressed
#
# Run: ansible-playbook tests/test_node_address.yml
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _resolve: "{{ playbook_dir | dirname }}/tasks/providers/remnawave/resolve_node_address.yml"
    remnawave_node_port: 2222
    remnawave_node_address_fallback: "203.0.113.10"
    remnawave_node_address: "quiet-falcon-a1b2c3d4.freesocks.example"
    remnawave_node_address_interface: ""
    remnawave_node_address_family: "ipv4"
    # Synthetic facts for a node on a tailnet: tailscale0 carries the CGNAT v4
    # plus a link-local and a global v6; br-lan exercises fact-key sanitizing;
    # dummy0 has no address family at all.
    _fake_facts: &fake_facts
      interfaces: ["lo", "eth0", "tailscale0", "br-lan", "dummy0"]
      lo:
        ipv4: { address: "127.0.0.1" }
      eth0:
        ipv4: { address: "203.0.113.10" }
      tailscale0:
        ipv4: { address: "100.100.64.7" }
        ipv6:
          - { address: "fe80::abcd", prefix: "64", scope: "link" }
          - { address: "fd7a:115c:a1e0::1234", prefix: "128", scope: "global" }
      br_lan:
        ipv4: { address: "10.20.0.1" }
      dummy0:
        ipv6:
          - { address: "fe80::dead", prefix: "64", scope: "link" }
      # BSD/macOS fact shape: ipv4 is a LIST and ipv6 entries carry no scope.
      utun3:
        ipv4:
          - { address: "100.100.64.9", netmask: "255.255.255.255" }
        ipv6:
          - { address: "fe80::9", prefix: "64" }
          - { address: "fd7a:115c:a1e0::9", prefix: "128" }
  tasks:
    # ---------------------------------------------------------------- (a) name
    - name: (a1) Resolve with no interface selected
      include_tasks: "{{ _resolve }}"
      vars:
        ansible_facts: *fake_facts

    - name: (a1) Assert the configured name is used verbatim
      assert:
        that:
          - remnawave_node_address_effective == 'quiet-falcon-a1b2c3d4.freesocks.example'
        success_msg: "No interface selected → remnawave_node_address wins."

    - name: (a2) Resolve with the address blanked
      include_tasks: "{{ _resolve }}"
      vars:
        ansible_facts: *fake_facts
        remnawave_node_address: ""

    - name: (a2) Assert the public-address fallback is used
      assert:
        that:
          - remnawave_node_address_effective == '203.0.113.10'
        success_msg: "Blank remnawave_node_address → the fallback (the machine's public address)."

    # ----------------------------------------------------------- (b) interface
    - name: (b1) Resolve from the tailscale0 interface
      include_tasks: "{{ _resolve }}"
      vars:
        ansible_facts: *fake_facts
        remnawave_node_address_interface: "tailscale0"

    - name: (b1) Assert the interface IPv4 beats the configured name
      assert:
        that:
          - remnawave_node_address_effective == '100.100.64.7'
        success_msg: "tailscale0 → its 100.x address, not the hostname the panel can't resolve."

    - name: (b2) Resolve the interface's IPv6
      include_tasks: "{{ _resolve }}"
      vars:
        ansible_facts: *fake_facts
        remnawave_node_address_interface: "tailscale0"
        remnawave_node_address_family: "ipv6"

    - name: (b2) Assert the GLOBAL-scope v6 is chosen, unbracketed
      assert:
        that:
          - remnawave_node_address_effective == 'fd7a:115c:a1e0::1234'
        success_msg: "family=ipv6 → the global-scope address; link-local skipped."

    - name: (b3) Resolve a device whose fact key is sanitized (br-lan → br_lan)
      include_tasks: "{{ _resolve }}"
      vars:
        ansible_facts: *fake_facts
        remnawave_node_address_interface: "br-lan"

    - name: (b3) Assert the sanitized fact key is found
      assert:
        that:
          - remnawave_node_address_effective == '10.20.0.1'
        success_msg: "Kernel device name with '-' resolves through the '_' fact key."

    - name: (b4) Re-resolve with the interface cleared again
      include_tasks: "{{ _resolve }}"
      vars:
        ansible_facts: *fake_facts

    - name: (b4) Assert the interface address did not stick as a fact
      assert:
        that:
          - remnawave_node_address_effective == 'quiet-falcon-a1b2c3d4.freesocks.example'
        success_msg: "Every include re-derives the fact — no stale value from an earlier include."

    - name: (b5) Resolve a BSD/macOS-shaped interface (ipv4 as a list)
      include_tasks: "{{ _resolve }}"
      vars:
        ansible_facts: *fake_facts
        remnawave_node_address_interface: "utun3"

    - name: (b5) Assert the list-shaped IPv4 fact resolves
      assert:
        that:
          - remnawave_node_address_effective == '100.100.64.9'
        success_msg: "ipv4 as a LIST (BSD/macOS facts) resolves like the Linux mapping."

    - name: (b5) Resolve the same interface's IPv6 with no scope keys
      include_tasks: "{{ _resolve }}"
      vars:
        ansible_facts: *fake_facts
        remnawave_node_address_interface: "utun3"
        remnawave_node_address_family: "ipv6"

    - name: (b5) Assert the unscoped fallback skips link-local
      assert:
        that:
          - remnawave_node_address_effective == 'fd7a:115c:a1e0::9'
        success_msg: "No scope keys → first non-fe80:: address, never the link-local one."

    # ------------------------------------------------------------ (c) failures
    - name: (c1) An unknown interface must fail
      block:
        - name: (c1) Resolve a device the node does not have
          include_tasks: "{{ _resolve }}"
          vars:
            ansible_facts: *fake_facts
            remnawave_node_address_interface: "wg0"
        - name: (c1) Unreached
          assert:
            that: [false]
            fail_msg: "An unknown interface resolved instead of failing."
      rescue:
        - name: (c1) Assert the failure names the interfaces that do exist
          assert:
            that:
              - "'wg0' in (ansible_failed_result.msg | default(''))"
              - "'tailscale0' in (ansible_failed_result.msg | default(''))"
            success_msg: "Unknown interface fails, and the message lists what the node has."

    - name: (c2) An interface with no IPv4 must fail
      block:
        - name: (c2) Resolve a v6-only device as ipv4
          include_tasks: "{{ _resolve }}"
          vars:
            ansible_facts: *fake_facts
            remnawave_node_address_interface: "dummy0"
        - name: (c2) Unreached
          assert:
            that: [false]
            fail_msg: "An interface with no IPv4 resolved instead of failing."
      rescue:
        - name: (c2) Assert the failure explains the empty address
          assert:
            that:
              - "'dummy0' in (ansible_failed_result.msg | default(''))"
              - "'IPv4' in (ansible_failed_result.msg | default(''))"
            success_msg: "No IPv4 on the interface fails loudly (never registers an empty address)."

    - name: (c3) Link-local-only IPv6 must fail
      block:
        - name: (c3) Resolve a link-local-only device as ipv6
          include_tasks: "{{ _resolve }}"
          vars:
            ansible_facts: *fake_facts
            remnawave_node_address_interface: "dummy0"
            remnawave_node_address_family: "ipv6"
        - name: (c3) Unreached
          assert:
            that: [false]
            fail_msg: "A link-local-only interface resolved instead of failing."
      rescue:
        - name: (c3) Assert the failure calls out global scope
          assert:
            that:
              - "'global-scope IPv6' in (ansible_failed_result.msg | default(''))"
            success_msg: "Link-local is refused — the panel cannot dial it."

    - name: (c4) An invalid address family must fail
      block:
        - name: (c4) Resolve with a bogus family
          include_tasks: "{{ _resolve }}"
          vars:
            ansible_facts: *fake_facts
            remnawave_node_address_interface: "tailscale0"
            remnawave_node_address_family: "ipv5"
        - name: (c4) Unreached
          assert:
            that: [false]
            fail_msg: "An invalid remnawave_node_address_family was accepted."
      rescue:
        - name: (c4) Assert the family validation fired
          assert:
            that:
              - "'remnawave_node_address_family' in (ansible_failed_result.msg | default(''))"
            success_msg: "Only ipv4/ipv6 are accepted."

    # ---------------------------------------------------------- (d) structural
    - name: (d1) Read the enrollment and the role entry point
      set_fact:
        _reg_src: "{{ lookup('file', playbook_dir | dirname ~ '/tasks/providers/fcp/register_node.yml') }}"
        _main_src: "{{ lookup('file', playbook_dir | dirname ~ '/tasks/main.yml') }}"

    - name: (d1) Assert the enrollment body carries the RESOLVED address
      assert:
        that:
          # The wire body, not a comment: the management address IS the fact.
          - "\"'address': remnawave_node_address_effective\" in _reg_src"
          # ...and never the raw var or the interface selector.
          - "'remnawave_node_address_interface' not in _reg_src"
          - "\"'address': remnawave_node_address,\" not in _reg_src"
        success_msg: "PUT …/nodes/by-name/{name} carries the resolved management address."

    - name: (d1) Assert main.yml resolves the address before enrolling
      assert:
        that:
          # A bare sibling filename does NOT resolve from tasks/providers/<x>/ —
          # ansible searches the role's tasks/ dir, not the including file's dir.
          - "'include_tasks: providers/remnawave/resolve_node_address.yml' in _main_src"
          - "'include_tasks: resolve_node_address.yml' not in _main_src"
          - "'include_tasks: providers/fcp/register_node.yml' in _main_src"
          - >-
            _main_src.find('providers/remnawave/resolve_node_address.yml')
            < _main_src.find('providers/fcp/register_node.yml')
          # The public address is detected first: it is the resolver's fallback.
          - >-
            _main_src.find('setup/public_addresses.yml')
            < _main_src.find('providers/remnawave/resolve_node_address.yml')
          # The node's NAME is on the machine BEFORE the first FCP call, so a
          # run that stops halfway resumes against the same node.
          - "'include_tasks: setup/identity.yml' in _main_src"
          - >-
            _main_src.find('setup/identity.yml')
            < _main_src.find('providers/fcp/register_node.yml')
        success_msg: "main.yml resolves the identity, detects the public address, resolves the management address, then enrolls."

    - name: (d1) Read the identity resolution
      set_fact:
        _identity_src: "{{ lookup('file', playbook_dir | dirname ~ '/tasks/setup/identity.yml') }}"

    # The NAME is persisted before FCP is called; the MODE only once FCP has
    # accepted it, so a mode this role cannot check (a typo, a mode the backend
    # is not set up for) is corrected by running again rather than by deleting a
    # file on the machine.
    - name: (d1) Assert the name is persisted before enrolling and the mode after
      assert:
        that:
          - "'.node_name' in _identity_src"
          - "'/.node_mode\"' not in _identity_src"
          - "'/.node_mode\"' in _reg_src"
          - >-
            _reg_src.find('Fail closed when FCP refused')
            < _reg_src.find('Persist the mode FCP accepted')
          - >-
            _reg_src.find('Persist the mode FCP accepted')
            < _reg_src.find('Fetch the machine configuration')
          # A purpose left by an earlier release is translated, not ignored.
          - "'fcp_legacy_purpose_modes' in _identity_src"
          - "'.node_purpose' in _identity_src"
          # Same include gotcha as above, from tasks/setup/ this time.
          - "'include_tasks: setup/node_name.yml' in _identity_src"
        success_msg: "the name is persisted before enrolling, the mode after FCP accepted it."

    # ------------------------------------------------------ (d2) STRUCTURAL
    # A device can be in the fact set and still have no usable address — e.g.
    # tailscaled is up (so tailscale0 exists) but `tailscale up` has not run
    # yet, and something earlier in the play runs it. Gating the refresh on
    # "device absent from ansible_facts" skips it in exactly that case, and the
    # extractor then fails on an interface that is by then perfectly fine.
    # Behaviour here depends on a REAL re-gather, which an offline test cannot
    # stage — so pin the gate itself, which is the part that can regress.
    - name: (d2) Read the resolver source
      set_fact:
        _resolve_src: "{{ lookup('file', _resolve) }}"

    # Slice from the task name to the next task, so the explanatory comment
    # above it (which names the rejected presence check) cannot satisfy these.
    - name: (d2) Materialize the fact-refresh task
      set_fact:
        _refresh_task: >-
          {{ _resolve_src[_resolve_src.find('- name: Gather network facts'):
                          _resolve_src.find('- name: Select the interface fact key')] }}

    - name: (d2) Assert the refresh runs whenever an interface is requested
      assert:
        that:
          - _refresh_task | length > 0
          - "'setup:' in _refresh_task"
          - "'network' in _refresh_task"
          - "'remnawave_node_address_interface' in _refresh_task"
          # The regression this guards: any presence test on the fact set.
          - "'not in ansible_facts' not in _refresh_task"
          - "'in ansible_facts' not in _refresh_task"
        success_msg: "The fact refresh is gated only on the interface selector, so stale addresses cannot survive it."

    - name: All node-address tests passed
      debug:
        msg: "OK"
