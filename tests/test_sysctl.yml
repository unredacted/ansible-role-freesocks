---
# tests/test_sysctl.yml
#
# Offline test of tasks/setup/sysctl.yml against a fake kernel (a `sysctl` and
# a `modprobe` on PATH that keep their state in a JSON file):
#   (a) the default raises rmem_max/wmem_max to 16 MiB in the role's drop-in
#       and applies it at once; (b) a second run changes nothing; (c) a run
#       that wrote the file but never applied it applies on the next run;
#   (d) a larger limit the machine already has is kept (raise only);
#   (e) BBR (the default) adds fq + bbr, loads tcp_bbr at boot, writes down
#       what the kernel ran before and gives fq to the default routes'
#       interfaces at once (a multiqueue one through mq), leaving one with
#       somebody's shaping alone; (e2) a second run changes nothing;
#   (g) BBR off puts the earlier values and qdiscs back and forgets the
#       record; (g2) and does nothing more on the next run;
#   (j) a machine an earlier release gave BBR has no earlier values: none
#       are invented, and off leaves the kernel to its next boot;
#   (h) a kernel without BBR stops the run and leaves no boot file asking for
#       it; (i) with both off the drop-in is removed.
# (a)-(d) run with BBR off, to look at the buffers alone.
#
# Run: ansible-playbook tests/test_sysctl.yml
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _dir: "{{ playbook_dir }}/.sysctl"
    _state_file: "{{ playbook_dir }}/.sysctl/state.json"
    _fcp_become: false
    node_name: "quiet-falcon-nest"
    node_sysctl_file: "{{ playbook_dir }}/.sysctl/sysctl.d/60-freesocks-node.conf"
    node_sysctl_modules_file: "{{ playbook_dir }}/.sysctl/modules-load.d/freesocks-node.conf"
    node_sysctl_previous_file: "{{ playbook_dir }}/.sysctl/sysctl.d/60-freesocks-node.previous"
    node_tcp_bbr: false
    _kernel_default:
      values:
        net.core.rmem_max: "212992"
        net.core.wmem_max: "212992"
        net.core.default_qdisc: pfifo_fast
        net.ipv4.tcp_congestion_control: cubic
        net.ipv4.tcp_available_congestion_control: "reno cubic"
      calls: []
    # eth0: multiqueue, the IPv4 default route. eth1: one queue, the IPv6
    # default route. tun0: a second IPv4 default route with shaping on it.
    # eth2 and eth9: two more IPv6 default routes (see below).
    _kernel_links:
      routes:
        "-4": "default via 192.0.2.1 dev eth0 proto dhcp \\ default via 198.51.100.1 dev tun0 metric 50"
        "-6": "default via fe80::1 dev eth1 proto ra metric 100 pref medium \\ default via fe80::2 dev eth2 metric 200 \\ default dev eth9 metric 300"
      qdiscs:
        eth0:
          - {kind: mq, handle: "0:", root: true}
          - {kind: fq_codel, handle: "0:", parent: ":1"}
          - {kind: fq_codel, handle: "0:", parent: ":2"}
        eth1:
          - {kind: fq_codel, handle: "0:", root: true}
        # eth2: a kernel-default kind, but attached by hand. eth9: tc cannot read it.
        eth2:
          - {kind: fq_codel, handle: "8002:", root: true}
        tun0:
          - {kind: htb, handle: "1:", root: true}
  environment:
    PATH: "{{ playbook_dir }}/.sysctl/bin:{{ lookup('env', 'PATH') }}"
    FAKE_SYSCTL_STATE: "{{ playbook_dir }}/.sysctl/state.json"
  tasks:
    - name: Prepare the fake kernel
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ _dir }}/bin"
        - "{{ _dir }}/sysctl.d"
        - "{{ _dir }}/modules-load.d"

    - name: Put the fake tools on PATH
      copy:
        dest: "{{ _dir }}/bin/{{ item }}"
        mode: '0755'
        content: |
          #!/usr/bin/env python3
          import json, os, re, sys
          path = os.environ["FAKE_SYSCTL_STATE"]
          state = json.load(open(path))
          args = sys.argv[1:]
          state["calls"].append(["{{ item }}"] + args)
          def save():
              json.dump(state, open(path, "w"), indent=2)
          if "{{ item }}" == "modprobe":
              if args == ["tcp_bbr"] and state.get("bbr_module", True):
                  state["values"]["net.ipv4.tcp_available_congestion_control"] = "reno cubic bbr"
              save()
              sys.exit(0)
          if "{{ item }}" == "ip":
              print(state.get("routes", {}).get(args[1], ""))
              save()
              sys.exit(0)
          if "{{ item }}" == "tc":
              # tc -j qdisc show dev DEV | tc qdisc replace dev DEV root KIND
              # | tc qdisc del dev DEV root, as the kernel answers them.
              dev = args[args.index("dev") + 1]
              q = state.get("qdiscs", {}).get(dev)
              if q is None:
                  save(); sys.exit(1)
              if "show" in args:
                  print(json.dumps(q)); save(); sys.exit(0)
              default = state["values"]["net.core.default_qdisc"]
              root = [e for e in q if e.get("root")][0]
              queues = len(q) - 1
              def mq(handle):
                  return [{"kind": "mq", "handle": handle, "root": True}] + [
                      {"kind": default, "handle": "0:", "parent": "%s%d" % (handle, i + 1)} for i in range(queues)]
              if "del" in args:
                  if root["handle"] == "0:":
                      save(); sys.exit(2)
                  state["qdiscs"][dev] = mq("0:") if root["kind"] == "mq" else [{"kind": default, "handle": "0:", "root": True}]
              elif "replace" in args:
                  kind = args[-1]
                  if kind == root["kind"] and root["handle"] != "0:":
                      pass  # the kernel changes the qdisc in place: nothing new
                  elif kind == "mq":
                      state["qdiscs"][dev] = mq("8001:")
                  else:
                      state["qdiscs"][dev] = [{"kind": kind, "handle": "8001:", "root": True}]
              save()
              sys.exit(0)
          if args[:1] == ["-n"]:
              for k in args[1:]:
                  if k not in state["values"]:
                      save(); sys.exit(255)
                  print(state["values"][k])
              save()
              sys.exit(0)
          if args[:1] == ["-p"]:
              for line in open(args[1]):
                  m = re.match(r"^\s*([a-z0-9_.]+)\s*=\s*(\S+)\s*$", line)
                  if m:
                      k, v = m.groups()
                      if k == "net.ipv4.tcp_congestion_control" and v not in state["values"]["net.ipv4.tcp_available_congestion_control"].split():
                          save(); sys.exit(255)
                      state["values"][k] = v
                      print(f"{k} = {v}")
              save()
              sys.exit(0)
          save()
          sys.exit(2)
      loop: [sysctl, modprobe, ip, tc]

    - block:
        - name: BBR is on unless turned off
          assert:
            that:
              - (lookup('file', playbook_dir ~ '/../defaults/main.yml') | from_yaml).node_tcp_bbr == true
            quiet: true

        - name: (a) the default, on a kernel with its usual limits
          copy:
            dest: "{{ _state_file }}"
            content: "{{ _kernel_default | to_nice_json }}"
        - name: (a) run
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/sysctl.yml
        - name: (a) read the kernel
          set_fact:
            _k: "{{ lookup('file', _state_file) | from_json }}"
        - name: (a) 16 MiB in the drop-in and in the kernel, BBR left alone
          assert:
            that:
              - "'net.core.rmem_max = 16777216' in lookup('file', node_sysctl_file)"
              - "'net.core.wmem_max = 16777216' in lookup('file', node_sysctl_file)"
              - "'tcp_congestion_control' not in lookup('file', node_sysctl_file)"
              - _k['values']['net.core.rmem_max'] == '16777216'
              - _k['values']['net.core.wmem_max'] == '16777216'
              - _k['values']['net.ipv4.tcp_congestion_control'] == 'cubic'
              - _sysctl_applied is changed
              - not (node_sysctl_modules_file is exists)
            success_msg: "QUIC buffers raised, at once and at boot."

        - name: (b) the same again
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/sysctl.yml
        - name: (b) nothing written, nothing applied
          assert:
            that:
              - _sysctl_written is not changed
              - _sysctl_applied is skipped
            success_msg: "idempotent."

        - name: (c) the kernel lost the setting (a run stopped before applying it)
          copy:
            dest: "{{ _state_file }}"
            content: "{{ (lookup('file', _state_file) | from_json) | combine({'values': {'net.core.rmem_max': '212992'}}, recursive=true) | to_nice_json }}"
        - name: (c) run
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/sysctl.yml
        - name: (c) applied though the file did not change
          assert:
            that:
              - _sysctl_written is not changed
              - _sysctl_applied is changed
              - (lookup('file', _state_file) | from_json)['values']['net.core.rmem_max'] == '16777216'
            success_msg: "what the kernel runs is checked, not only the file."

        - name: (d) a machine with a larger receive limit already
          copy:
            dest: "{{ _state_file }}"
            content: "{{ _kernel_default | combine({'values': {'net.core.rmem_max': '33554432'}}, recursive=true) | to_nice_json }}"
        - name: (d) run
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/sysctl.yml
        - name: (d) the larger limit is kept
          assert:
            that:
              - "'net.core.rmem_max = 33554432' in lookup('file', node_sysctl_file)"
              - "'net.core.wmem_max = 16777216' in lookup('file', node_sysctl_file)"
              - (lookup('file', _state_file) | from_json)['values']['net.core.rmem_max'] == '33554432'
            success_msg: "raise only."

        - name: (e) a kernel with its usual settings and three interfaces
          copy:
            dest: "{{ _state_file }}"
            content: "{{ _kernel_default | combine(_kernel_links) | combine({'values': {'net.core.default_qdisc': 'fq_codel'}}, recursive=true) | to_nice_json }}"
        - name: (e) BBR on
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/sysctl.yml
          vars:
            node_tcp_bbr: true
        - name: (e) read the kernel
          set_fact:
            _k: "{{ lookup('file', _state_file) | from_json }}"
        - name: (e) fq + bbr now and at boot, the earlier values written down, fq on the live interfaces
          assert:
            that:
              - "'net.core.default_qdisc = fq' in lookup('file', node_sysctl_file)"
              - "'net.ipv4.tcp_congestion_control = bbr' in lookup('file', node_sysctl_file)"
              - "'tcp_bbr' in lookup('file', node_sysctl_modules_file)"
              - _k['values']['net.ipv4.tcp_congestion_control'] == 'bbr'
              - _k['values']['net.core.default_qdisc'] == 'fq'
              - "'net.ipv4.tcp_congestion_control = cubic' in lookup('file', node_sysctl_previous_file)"
              - "'net.core.default_qdisc = fq_codel' in lookup('file', node_sysctl_previous_file)"
              - "'# qdisc: eth0' in lookup('file', node_sysctl_previous_file)"
              - "'# qdisc: eth1' in lookup('file', node_sysctl_previous_file)"
              - "'tun0' not in lookup('file', node_sysctl_previous_file)"
              - _k['qdiscs']['eth0'] | map(attribute='kind') | list == ['mq', 'fq', 'fq']
              - _k['qdiscs']['eth1'] | map(attribute='kind') | list == ['fq']
              - _k['qdiscs']['tun0'] | map(attribute='kind') | list == ['htb']
              - "['tc', 'qdisc', 'replace', 'dev', 'eth0', 'root', 'mq'] in _k['calls']"
              - "['tc', 'qdisc', 'replace', 'dev', 'eth1', 'root', 'fq'] in _k['calls']"
              - _k['calls'].index(['sysctl', '-p', node_sysctl_file]) < _k['calls'].index(['tc', 'qdisc', 'replace', 'dev', 'eth0', 'root', 'mq'])
              - _k['qdiscs']['eth2'] == _kernel_links.qdiscs.eth2
              - "'eth2' not in lookup('file', node_sysctl_previous_file)"
              - _sysctl_qdisc_plan.kept == ['eth2 (fq_codel, set by hand)', 'eth9 (not read)', 'tun0 (htb)']
            success_msg: "BBR and fq at once; shaping, a qdisc set by hand and an unread interface left alone and named."

        - name: (e2) forget the calls so far
          copy:
            dest: "{{ _state_file }}"
            content: "{{ (lookup('file', _state_file) | from_json) | combine({'calls': []}) | to_nice_json }}"
        - name: (e2) the same again
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/sysctl.yml
          vars:
            node_tcp_bbr: true
        - name: (e2) read the kernel
          set_fact:
            _k: "{{ lookup('file', _state_file) | from_json }}"
        - name: (e2) nothing written, applied or changed; the record still says cubic
          assert:
            that:
              - _sysctl_written is not changed
              - _sysctl_applied is skipped
              - _k['calls'] | select('contains', 'replace') | list | length == 0
              - _k['calls'] | select('contains', 'del') | list | length == 0
              - _k['calls'] | select('contains', '-p') | list | length == 0
              - "'net.ipv4.tcp_congestion_control = cubic' in lookup('file', node_sysctl_previous_file)"
              - "'# qdisc: eth0' in lookup('file', node_sysctl_previous_file)"
            success_msg: "idempotent with BBR on."

        - name: (g) BBR off again
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/sysctl.yml
        - name: (g) read the kernel
          set_fact:
            _k: "{{ lookup('file', _state_file) | from_json }}"
        - name: (g) the earlier values and qdiscs are back, the buffers stay
          assert:
            that:
              - _k['values']['net.ipv4.tcp_congestion_control'] == 'cubic'
              - _k['values']['net.core.default_qdisc'] == 'fq_codel'
              - _k['qdiscs']['eth0'] | map(attribute='kind') | list == ['mq', 'fq_codel', 'fq_codel']
              - _k['qdiscs']['eth1'] | map(attribute='kind') | list == ['fq_codel']
              - _k['qdiscs']['tun0'] | map(attribute='kind') | list == ['htb']
              - "'tcp_congestion_control' not in lookup('file', node_sysctl_file)"
              - "'default_qdisc' not in lookup('file', node_sysctl_file)"
              - "'net.core.rmem_max = 16777216' in lookup('file', node_sysctl_file)"
              - not (node_sysctl_previous_file is exists)
              - not (node_sysctl_modules_file is exists)
            success_msg: "off: what the kernel ran before is back."

        - name: (g2) forget the calls so far
          copy:
            dest: "{{ _state_file }}"
            content: "{{ (lookup('file', _state_file) | from_json) | combine({'calls': []}) | to_nice_json }}"
        - name: (g2) off, again
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/sysctl.yml
        - name: (g2) nothing put back twice
          assert:
            that:
              - _sysctl_restored is skipped
              - (lookup('file', _state_file) | from_json)['calls'] | select('contains', 'tc') | list | length == 0
              - (lookup('file', _state_file) | from_json)['calls'] | select('contains', '-p') | list | length == 0
            success_msg: "idempotent with BBR off."

        - name: (j) a machine an earlier release gave BBR (drop-in, no record)
          copy:
            dest: "{{ _state_file }}"
            content: >-
              {{ _kernel_default | combine(_kernel_links)
                 | combine({'values': {'net.core.default_qdisc': 'fq', 'net.ipv4.tcp_congestion_control': 'bbr',
                                       'net.ipv4.tcp_available_congestion_control': 'reno cubic bbr'}}, recursive=true)
                 | to_nice_json }}
        - name: (j) its drop-in
          copy:
            dest: "{{ node_sysctl_file }}"
            content: "net.core.default_qdisc = fq\nnet.ipv4.tcp_congestion_control = bbr\n"
        - name: (j) BBR on with this release, twice
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/sysctl.yml
          vars:
            node_tcp_bbr: true
          loop: [1, 2]
        - name: (j) the role's own BBR is not written down as what came before
          assert:
            that:
              - "'net.' not in lookup('file', node_sysctl_previous_file)"
              - "'# qdisc: eth0' in lookup('file', node_sysctl_previous_file)"
            success_msg: "no earlier values invented."
        - name: (j) BBR off
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/sysctl.yml
        - name: (j) nothing put back, the record forgotten, the drop-in without BBR
          assert:
            that:
              - _sysctl_restored is skipped
              - (lookup('file', _state_file) | from_json)['values']['net.ipv4.tcp_congestion_control'] == 'bbr'
              - not (node_sysctl_previous_file is exists)
              - "'tcp_congestion_control' not in lookup('file', node_sysctl_file)"
            success_msg: "off without a record: left to the next boot, and said so."

        - name: (h) a kernel without BBR
          block:
            - name: Write a kernel without the module
              copy:
                dest: "{{ _state_file }}"
                content: "{{ _kernel_default | combine(_kernel_links) | combine({'bbr_module': false}) | to_nice_json }}"
            - name: Leave a boot file from an earlier kernel
              copy:
                dest: "{{ node_sysctl_modules_file }}"
                content: "tcp_bbr\n"
            - name: Run with BBR on
              include_role:
                name: ansible-role-freesocks
                tasks_from: setup/sysctl.yml
              vars:
                node_tcp_bbr: true
            - name: (h) Unreached
              assert:
                that: [false]
                fail_msg: "BBR was set on a kernel without it."
          rescue:
            - name: (h) the run stops and says why, and touches nothing
              assert:
                that:
                  - "'offers no BBR' in (ansible_failed_result.msg | default(''))"
                  - not (node_sysctl_modules_file is exists)
                  - not (node_sysctl_previous_file is exists)
                  - (lookup('file', _state_file) | from_json)['qdiscs']['eth1'][0]['kind'] == 'fq_codel'
                success_msg: "no BBR: the run stops, no boot file, no record, no qdisc changed."

        - name: (i) both off
          include_role:
            name: ansible-role-freesocks
            tasks_from: setup/sysctl.yml
          vars:
            node_quic_buffers: false
            node_tcp_bbr: false
        - name: (i) the drop-in and the module file are gone
          assert:
            that:
              - not (node_sysctl_file is exists)
              - not (node_sysctl_modules_file is exists)
            success_msg: "off: nothing of the role's is left."
      always:
        - name: Remove the fake kernel
          file:
            path: "{{ _dir }}"
            state: absent
