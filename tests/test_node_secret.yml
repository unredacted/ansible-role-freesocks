---
# tests/test_node_secret.yml
#
# Offline test of tasks/setup/remnanode_compose.yml: FCP serves a new panel
# node secret on every run (each GET /api/keygen mints a new node
# certificate), and the node keeps the one it has, so a repeat run leaves the
# compose file, and so the container, alone. Secrets are throwaway ones from
# tests/make_node_secret.py.
#   (a) a fresh node: FCP's secret is written;
#   (b) a repeat run, FCP serving a new secret: the file is unchanged;
#   (c) remnawave_node_rotate_secret: FCP's new one is written;
#   (d) force_reinstall_remnawave: likewise;
#   (e) a secret for another panel CA and JWT key: replaced;
#   (f) a node certificate ending within the minimum: replaced;
#   (f2) a node certificate that starts in the future: replaced;
#   (g) a node certificate the CA did not sign: replaced;
#   (h) an unreadable secret on the node: replaced;
#   (i) FCP's secret is not a node secret: written as before (no guessing).
# The secret read from the node is not left behind as a fact.
#
# Run: ansible-playbook tests/test_node_secret.yml
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _fcp_become: false
    _dir: "{{ playbook_dir }}/.node_secret"
    remnawave_node_install_dir: "{{ _dir }}"
    _fcp_bootstrap:
      nodePort: 2222
  tasks:
    - block:
        - name: Start from a clean scratch directory
          file:
            path: "{{ _dir }}"
            state: "{{ item }}"
          loop: [absent, directory]

        - name: Mint throwaway panel secrets
          command: "{{ ansible_playbook_python }} {{ playbook_dir }}/make_node_secret.py"
          register: _mint
          changed_when: false
          no_log: true

        - name: Keep them
          set_fact:
            _s: "{{ _mint.stdout | from_json }}"
          no_log: true

        # (a)
        - include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a1 }}" }
        - name: (a) a fresh node gets FCP's secret
          assert:
            that:
              - _run_changed | bool
              - _run_choice == 'none_on_host'
              - _on_disk == _s.a1
              - _left_over == ''
          no_log: true

        # (b)
        - include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a2 }}" }
        - name: (b) a repeat run keeps the node's secret and leaves the file alone
          assert:
            that:
              - not (_run_changed | bool)
              - _run_choice == 'kept'
              - _on_disk == _s.a1
              - _left_over == ''
          no_log: true

        - include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a3 }}" }
        - name: (b) and again
          assert:
            that:
              - not (_run_changed | bool)
              - _on_disk == _s.a1
          no_log: true

        # (c)
        - include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a2 }}", _rotate: true }
        - name: (c) asked to rotate, the node gets FCP's new secret
          assert:
            that:
              - _run_changed | bool
              - _run_choice == 'rotation_asked'
              - _on_disk == _s.a2
          no_log: true

        # (d)
        - include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a3 }}", _force: true }
        - name: (d) force_reinstall_remnawave rotates too
          assert:
            that:
              - _run_changed | bool
              - _run_choice == 'rotation_asked'
              - _on_disk == _s.a3
          no_log: true

        # (e)
        - include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.b1 }}" }
        - name: (e) another panel's CA and JWT key replace it
          assert:
            that:
              - _run_changed | bool
              - _run_choice == 'other_panel'
              - _on_disk == _s.b1
          no_log: true

        # (f)
        - name: (f) the node holds a secret whose certificate ends in 10 days
          include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a_expiring }}", _rotate: true }
        - include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a1 }}" }
        - name: (f) an ending certificate is replaced
          assert:
            that:
              - _run_changed | bool
              - _run_choice == 'expiring'
              - _on_disk == _s.a1
          no_log: true

        # (f2)
        - name: (f2) the node holds a certificate that starts in 2 days
          include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a_future }}", _rotate: true }
        - include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a3 }}" }
        - name: (f2) a certificate not valid yet is replaced
          assert:
            that:
              - _run_changed | bool
              - _run_choice == 'not_yet_valid'
              - _on_disk == _s.a3
          no_log: true

        # (g)
        - name: (g) the node holds a certificate another CA signed
          include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a_foreign_cert }}", _rotate: true }
        - include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a2 }}" }
        - name: (g) a certificate the panel's CA did not sign is replaced
          assert:
            that:
              - _run_changed | bool
              - _run_choice == 'unreadable'
              - _on_disk == _s.a2
          no_log: true

        # (h)
        - name: (h) the node holds something that is not a node secret
          include_tasks: node_secret_run.yml
          vars: { _serve: "bm90LWEtbm9kZS1zZWNyZXQ=", _rotate: true }
        - include_tasks: node_secret_run.yml
          vars: { _serve: "{{ _s.a1 }}" }
        - name: (h) an unreadable secret is replaced
          assert:
            that:
              - _run_changed | bool
              - _run_choice == 'unreadable'
              - _on_disk == _s.a1
          no_log: true

        # (i)
        - include_tasks: node_secret_run.yml
          vars: { _serve: "bm90LWEtbm9kZS1zZWNyZXQ=" }
        - name: (i) FCP's secret that is not a node secret is written as before
          assert:
            that:
              - _run_changed | bool
              - _run_choice == 'served_unreadable'
              - _on_disk == 'bm90LWEtbm9kZS1zZWNyZXQ='
          no_log: true
      always:
        - name: Clean up
          file:
            path: "{{ _dir }}"
            state: absent
